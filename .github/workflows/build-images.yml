name: build-images

# 우리가 빌드하는 이미지를 전부 빌드해 레지스트리에 올리고, 이름 → 다이제스트 표(digests.json)를 산출물로 낸다.
#
# 여기서 하지 않는 것: 서명, 채널 갱신. 빌드 서버에는 비공개 키를 두지 않는다 — 릴리스를 내는 사람이
# digests.json 을 내려받아 자기 PC 에서 manifest 를 만들고 서명한다(docs/releases.md).
#
# 설정(리포 Variables/Secrets — 전부 선택, 기본은 GHCR + GITHUB_TOKEN):
#   vars.JW_REGISTRY        레지스트리 호스트 (기본 ghcr.io)
#   vars.JW_IMAGE_NS        네임스페이스 (기본 리포 소유자)
#   vars.JW_IMAGE_PREFIX    이미지 이름 앞머리 (기본 just-workspace-) — compose 의 이미지 이름과 같아야 한다
#   secrets.REGISTRY_USER / secrets.REGISTRY_TOKEN   GHCR 가 아닌 레지스트리일 때의 로그인
#
# 액션은 커밋 SHA 로 고정한다(옆 주석이 그 SHA 의 태그). 올릴 때는 SHA 와 주석을 함께 바꾼다.

# 트리거: Beta 태그(vX.Y.Z-beta.N)와 수동 실행뿐이다. Stable 은 다시 빌드하지 않는다 —
# 검증을 마친 Beta 의 이미지(같은 다이제스트)를 승격해서만 만든다(docs/releases.md).
on:
  push:
    tags: ["v*-beta.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "이미지 태그로 쓸 버전 (X.Y.Z 또는 X.Y.Z-beta.N)"
        required: true

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      registry: ${{ steps.ver.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REGISTRY_HOST: ${{ vars.JW_REGISTRY || 'ghcr.io' }}
          IMAGE_NS: ${{ vars.JW_IMAGE_NS || github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then v="${REF_NAME#v}"; else v="${INPUT_VERSION#v}"; fi
          if ! [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.[1-9][0-9]*)?$ ]]; then
            echo "::error::버전 꼴이 아니다(X.Y.Z 또는 X.Y.Z-beta.N): $v"; exit 1
          fi
          # 버전의 단일 출처는 리포 루트 VERSION. 태그로 빌드할 때는 둘이 같아야 한다.
          if [[ -f VERSION ]]; then
            file="$(tr -d '[:space:]' < VERSION)"
            if [[ "$file" != "$v" ]]; then
              if [[ "$REF_TYPE" == "tag" ]]; then
                echo "::error::태그($v)와 VERSION 파일($file)이 다르다"; exit 1
              fi
              echo "::warning::입력 버전($v)과 VERSION 파일($file)이 다르다"
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # 레지스트리 경로는 소문자만 허용된다
          echo "registry=${REGISTRY_HOST,,}/${IMAGE_NS,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # context / dockerfile / target 은 docker-compose.yml 의 build 설정과 같아야 한다. 이름 붙인 문맥 licenses 는
        # 모든 이미지에 같은 값(리포 루트)이라 매트릭스가 아니라 빌드 단계에 한 번 적는다
        # (release/tests/test_workflow.py 가 대조한다). name 은 compose 의 서비스 이름.
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            # 표시 버전의 예비값. 실행할 때 환경변수 JW_APP_VERSION 이 있으면 그것이 우선한다 —
            # 승격(Beta → Stable)은 이미지를 다시 빌드하지 않으므로 실제 표시 버전은 실행 환경이 넣어야 한다.
            build_args: JW_APP_VERSION
          - name: frontend-react
            context: frontend-react
            dockerfile: frontend-react/Dockerfile
          - name: sso
            context: sso
            dockerfile: sso/Dockerfile
          - name: ldap
            context: ldap
            dockerfile: ldap/Dockerfile
          - name: mailserver
            context: mailserver/image
            dockerfile: mailserver/image/Dockerfile
          - name: audiorelay
            context: audiorelay
            dockerfile: audiorelay/Dockerfile
            # 표시 버전의 예비값(바이너리에 굽는다). 실행할 때 환경변수 JW_APP_VERSION 이 있으면 그것이 우선한다.
            build_args: VERSION
          - name: docconv
            context: docconv
            dockerfile: docconv/Dockerfile
          - name: sandbox
            context: sandbox
            dockerfile: sandbox/Dockerfile
          - name: rbi-netfilter
            context: deploy/rbi-netfilter
            dockerfile: deploy/rbi-netfilter/Dockerfile
          - name: rbi-mirror
            context: rbi/mirror
            dockerfile: rbi/mirror/Dockerfile
            target: prod
          # 설치 관리자 — compose 에 없는 이미지. 컨텍스트는 리포 루트다(번들에 실을 파일이 리포 여기저기에 있다 —
          # 무엇이 들어가는지는 installer/Dockerfile.dockerignore). 받을 이미지 저장소를 빌드 인자로 굽는다.
          - name: installer
            context: .
            dockerfile: installer/Dockerfile
            build_args_registry: JW_REGISTRY
    env:
      IMAGE: ${{ needs.version.outputs.registry }}/${{ vars.JW_IMAGE_PREFIX || 'just-workspace-' }}${{ matrix.name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Dockerfile
        id: have
        shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          OPTIONAL: ${{ matrix.optional || 'false' }}
        run: |
          set -euo pipefail
          if [[ -f "$DOCKERFILE" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$OPTIONAL" == "true" ]]; then
            echo "::notice::$DOCKERFILE 이 없어 건너뛴다"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$DOCKERFILE 이 없다"; exit 1
          fi

      - name: Build args
        id: args
        if: steps.have.outputs.build == 'true'
        shell: bash
        env:
          ARG_NAMES: ${{ matrix.build_args || '' }}
          REGISTRY_ARG_NAMES: ${{ matrix.build_args_registry || '' }}
          REGISTRY: ${{ needs.version.outputs.registry }}
        run: |
          set -euo pipefail
          {
            echo "list<<__ARGS__"
            for name in $ARG_NAMES; do echo "$name=$VERSION"; done
            for name in $REGISTRY_ARG_NAMES; do echo "$name=$REGISTRY"; done
            echo "__ARGS__"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.have.outputs.build == 'true'

      - name: Registry login
        if: steps.have.outputs.build == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ vars.JW_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.name }}
        id: build
        if: steps.have.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # 라이선스 고지(LICENSE · NOTICE · THIRD_PARTY_LICENSES.md)를 이미지의 /licenses/ 에 넣는다 — compose 의
          # build.additional_contexts 와 같은 이름. 리포 루트의 .dockerignore 가 그 파일들만 보낸다.
          build-contexts: licenses=.
          target: ${{ matrix.target || '' }}
          build-args: ${{ steps.args.outputs.list }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # 증명 첨부를 끄면 다이제스트가 linux/amd64 이미지 하나를 바로 가리킨다(색인으로 감싸지지 않는다).
          provenance: false
          sbom: false

      - name: Record digest
        if: steps.have.outputs.build == 'true'
        shell: bash
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::다이제스트를 얻지 못했다: '$DIGEST'"; exit 1
          fi
          mkdir -p digest
          printf '{"name":"%s","repository":"%s","digest":"%s"}\n' "$NAME" "$IMAGE" "$DIGEST" > "digest/$NAME.json"
          echo "$NAME → $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest
        if: steps.have.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digest/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 1

  digests:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digest
          merge-multiple: true

      - name: Assemble digests.json
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REGISTRY: ${{ needs.version.outputs.registry }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os
          images = {}
          for path in sorted(glob.glob("digest/*.json")):
              with open(path, encoding="utf-8") as f:
                  item = json.load(f)
              images[item["name"]] = {"repository": item["repository"], "digest": item["digest"]}
          if not images:
              raise SystemExit("다이제스트가 하나도 없다")
          doc = {
              "format": 1,
              "version": os.environ["VERSION"],
              "registry": os.environ["REGISTRY"],
              "commit": os.environ["COMMIT"],
              "images": images,
          }
          with open("digests.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(doc, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(doc, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload digests.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests
          path: digests.json
          if-no-files-found: error
          retention-days: 90
