<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;">
<title>원격 접속 요청</title>
<link rel="stylesheet" href="remote-ui.css">
<style>
  html, body { height: 100%; overflow: hidden; background: hsl(var(--card)); }
  body { display: flex; flex-direction: column; border: 1px solid hsl(var(--border)); border-radius: 12px; overflow: hidden; }
  .titlebar { height: 40px; padding: 0 16px; }
  .titlebar span { display: inline-flex; align-items: center; gap: 6px; }
  .titlebar .icon { width: 12px; height: 12px; }
  main { flex: 1 1 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; min-height: 0; }
  h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; }
  .who { display: flex; gap: 16px; align-items: flex-start; }
  .who .avatar { width: 56px; height: 56px; font-size: 22px; }
  .who .lines { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; overflow-wrap: anywhere; }
  .name { font-size: 24px; line-height: 32px; font-weight: 700; }
  .email { font-family: var(--mono); font-size: 15px; line-height: 22px; }
  .org { font-size: 15px; line-height: 22px; font-weight: 500; }
  .can { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-radius: 10px; background: hsl(var(--muted)); }
  .can .head { font-size: 12px; line-height: 16px; font-weight: 600; color: hsl(var(--muted-foreground)); }
  .can .item { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; }
  .can .icon { width: 16px; height: 16px; color: hsl(var(--warning)); }
  .warn { margin: 0; font-size: 13px; line-height: 20px; color: hsl(var(--muted-foreground)); }
  .timer { display: flex; flex-direction: column; gap: 6px; }
  .timer .row { display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: hsl(var(--muted-foreground)); }
  .track { height: 4px; border-radius: 9999px; background: hsl(var(--muted)); overflow: hidden; }
  .track > div { height: 100%; background: hsl(var(--muted-foreground)); transition: width 1s linear; }
  footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid hsl(var(--border)); }
</style>
</head>
<body>
  <div class="titlebar">
    <span><span class="icon" data-icon="lock"></span><span id="app">Just Workspace 데스크톱 앱</span></span>
    <span><span class="icon" data-icon="pin"></span>항상 맨 위</span>
  </div>
  <main role="alertdialog" aria-labelledby="c-title" aria-describedby="c-who">
    <h1 id="c-title">원격 접속 요청</h1>
    <div class="who" id="c-who">
      <span class="avatar" id="avatar">?</span>
      <div class="lines">
        <span class="name" id="name">—</span>
        <span class="email" id="email" hidden></span>
        <span class="org" id="org" hidden></span>
      </div>
    </div>
    <div class="can">
      <span class="head">허용하면 이 사람이 할 수 있는 일</span>
      <div class="item"><span class="icon" data-icon="eye"></span>이 PC의 화면 전체 보기</div>
      <div class="item"><span class="icon" data-icon="mouse-pointer"></span>키보드·마우스로 이 PC 조작</div>
    </div>
    <p class="warn">요청을 예상하지 못했거나 이 사람을 모른다면 거부하세요. 전화나 메시지로 "접속을 허용해 달라"고 재촉하는 경우는 사기일 수 있습니다.</p>
    <div class="timer">
      <div class="row"><span>응답이 없으면 자동으로 거부합니다</span><span class="mono" id="left">0:30</span></div>
      <div class="track" role="progressbar" id="bar" aria-label="자동 거부까지 남은 시간" aria-valuemin="0" aria-valuemax="30" aria-valuenow="30"><div id="fill" style="width: 100%"></div></div>
    </div>
  </main>
  <footer>
    <button class="btn outline" id="deny" autofocus>거부</button>
    <button class="btn" id="allow">허용</button>
  </footer>
<script src="remote-icons.js"></script>
<script src="remote-consent.js"></script>
</body>
</html>
