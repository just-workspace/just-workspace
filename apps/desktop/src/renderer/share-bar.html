<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;">
<title>화면 공유 중</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* 항상-위 프레임리스 창. 회의 창과 별개이다.
     회의 창을 최소화해도 공유는 유지되므로, 중지 버튼에 항상 접근 가능해야 한다.
     미디어 표면에 부착되는 컨트롤이므로 라이트 테마에서도 다크를 유지한다. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Sans KR', 'Malgun Gothic', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
  }

  .bar {
    display: flex; align-items: center; gap: 4px;
    height: 44px; border-radius: 10px;
    background: #171f22; border: 1px solid #2f4c50;
    box-shadow: 0 10px 26px rgba(0, 0, 0, .44);
    padding: 0 6px 0 13px;
    -webkit-app-region: drag;
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ec3cc; flex-shrink: 0; }
  .label {
    font-size: 12px; font-weight: 500; color: #dbe7e8;
    margin-right: 6px; white-space: nowrap;
  }
  .sep { width: 1px; height: 22px; background: #2f4c50; margin-right: 2px; }

  .icon {
    width: 32px; height: 32px; border: 0; border-radius: 7px; background: none;
    display: flex; align-items: center; justify-content: center;
    cursor: default; -webkit-app-region: no-drag; padding: 0;
  }
  .icon:hover { background: rgba(255, 255, 255, .08); }
  /* 비활성 상태는 색상 변경만으로 표현하지 않는다 — 슬래시를 겹쳐 즉시 식별되도록 한다. */
  .icon[aria-pressed="false"] { position: relative; }
  .icon[aria-pressed="false"]::after {
    content: ''; position: absolute; left: 7px; right: 7px; top: 50%;
    height: 1.6px; background: #e08b86; transform: rotate(-45deg);
  }

  .stop {
    height: 32px; border: 0; border-radius: 7px; background: #b3312c;
    display: flex; align-items: center; padding: 0 12px; margin-left: 2px;
    font-family: inherit; font-size: 12px; font-weight: 500; color: #fff;
    cursor: default; -webkit-app-region: no-drag;
  }
  .stop:hover { filter: brightness(1.1); }

  @media (prefers-reduced-motion: no-preference) {
    .icon, .stop { transition: background 120ms ease-out, filter 120ms ease-out; }
  }
</style>
</head>
<body>

<div class="bar">
  <span class="dot"></span>
  <span class="label">화면을 공유하고 있습니다</span>
  <span class="sep"></span>

  <button class="icon" id="btn-mic" aria-pressed="true" aria-label="마이크">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cdd8da" stroke-width="1.9" stroke-linecap="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>

  <button class="icon" id="btn-cam" aria-pressed="false" aria-label="카메라">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cdd8da" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="10" rx="1.6"/><path d="m17 8 4-2v8l-4-2z"/></svg>
  </button>

  <button class="stop" id="btn-stop">공유 중지</button>
</div>

<script src="share-bar.js"></script>
</body>
</html>
