<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;">
<title>just-workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /*
   * 0.5.0 — 셸은 창 테두리 한 줄만 그린다. 레일·검색·상단바·활동 패널·사용자 메뉴는
   * 전부 본문 웹앱이 브라우저와 똑같이 그린다(웹 useDesktopShell: 0.5.0+ 는 웹 껍데기를 숨기지 않는다).
   */
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .titlebar.shell { height: 32px; padding-left: 10px; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .mark {
    width: 16px; height: 16px; border-radius: 4px; background: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .brand .name {
    color: var(--tb-brand-fg); font-size: 12px; font-weight: 500; letter-spacing: -0.01em;
  }
  .nav { display: flex; align-items: center; gap: 2px; -webkit-app-region: no-drag; }
  .nav button {
    width: 28px; height: 24px; border: 0; border-radius: 4px; background: none;
    display: flex; align-items: center; justify-content: center; cursor: default;
  }
  .nav button:hover:not(:disabled) { background: rgba(255, 255, 255, .08); }
  .nav button:disabled { opacity: .35; }
  .nav svg { stroke: var(--titlebar-icon); }
  .titlebar.shell .winbtn { width: 44px; height: 32px; }

  /* 본문: 여기에 웹 WebContentsView 가 덮인다. 메인이 이 요소의 좌표를 재서 뷰를 맞춘다. 비워 둔다. */
  .content { flex-grow: 1; min-height: 0; background: var(--canvas); position: relative; }
  .content .fallback {
    position: absolute; inset: 0; background: var(--app-bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 24px; text-align: center;
  }
  .content .fallback .t { font-size: 14px; font-weight: 600; }
  .content .fallback .d {
    font-size: 12px; color: var(--text-3); font-weight: var(--body-weight); line-height: 1.7;
    max-width: 46ch; white-space: pre-line;
  }
  .content .fallback button {
    margin-top: 4px; height: 32px; padding: 0 14px; border: 0; border-radius: 6px;
    background: var(--brand); color: #fff; font-family: inherit;
    font-size: 12.5px; font-weight: 500; cursor: default;
  }
</style>
</head>
<body>

<div class="titlebar shell">
  <div class="brand">
    <div class="mark">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
    </div>
    <span class="name" id="app-name">just-workspace</span>
  </div>

  <div class="nav">
    <button id="btn-back" aria-label="뒤로" title="뒤로 (Alt+←)" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="btn-fwd" aria-label="앞으로" title="앞으로 (Alt+→)" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button id="btn-refresh" aria-label="새로 고침" title="새로 고침 (F5)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
  </div>

  <div class="spacer"></div>

  <div style="display:flex; align-items:center; height:32px;">
    <button class="winbtn" id="btn-min" aria-label="최소화">
      <svg width="10" height="10" viewBox="0 0 12 12" stroke="var(--titlebar-icon)" stroke-width="1.2"><path d="M1 6h10"/></svg>
    </button>
    <button class="winbtn" id="btn-max" aria-label="최대화">
      <svg width="10" height="10" viewBox="0 0 12 12" stroke="var(--titlebar-icon)" stroke-width="1.2" fill="none"><rect x="1.5" y="1.5" width="9" height="9"/></svg>
    </button>
    <button class="winbtn close" id="btn-close" aria-label="닫기">
      <svg width="10" height="10" viewBox="0 0 12 12" stroke="var(--titlebar-icon)" stroke-width="1.2"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg>
    </button>
  </div>
</div>

<main class="content" id="content">
  <div class="fallback" id="content-fallback" hidden>
    <div class="t">워크스페이스를 열지 못했습니다</div>
    <div class="d" id="content-fallback-msg"></div>
    <button id="btn-reload">다시 시도</button>
  </div>
</main>

<script type="module" src="shell.js"></script>
</body>
</html>
