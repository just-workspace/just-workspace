<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:;">
<title>just-workspace 메뉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tokens.css">
<style>
  /* OS 기본 트레이 메뉴로는 아바타·동기화 상태·뱃지를 넣을 수 없어 직접 그린다.
     창은 투명하고 그림자만 바깥으로 나간다. */
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body { padding: 8px 10px 12px; }

  .menu {
    width: 232px;
    background: var(--card);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .36);
    padding: 5px;
  }

  .who { display: flex; align-items: center; gap: 9px; padding: 9px 11px 8px; }
  .who .av-wrap { position: relative; flex-shrink: 0; }
  .who .av {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--rail-avatar); color: var(--rail-avatar-fg);
    font-size: 11.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .who .presence {
    position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--ok); border: 2px solid var(--card);
  }
  .who .col { min-width: 0; }
  .who .nm {
    font-size: 12.5px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .who .host {
    font-size: 11px; color: var(--label); font-family: 'IBM Plex Mono', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .sep { height: 1px; background: var(--picker-divider); margin: 3px 4px 4px; }
  .sep.tight { margin: 4px; }

  .group { display: flex; flex-direction: column; gap: 1px; }

  button.item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 7px 11px; border: 0; border-radius: 5px;
    background: none; font-family: inherit; text-align: left; cursor: default;
    font-size: 12.5px; font-weight: 400; color: var(--text-2);
  }
  button.item:hover { background: var(--card-2); }
  button.item.on { background: var(--brand-tint-2); }
  button.item.on .lbl { color: var(--brand-strong); font-weight: 600; }
  button.item .lbl { flex-grow: 1; }
  button.item .right {
    margin-left: auto; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    color: var(--ok); flex-shrink: 0;
  }
  button.item .count {
    margin-left: auto; min-width: 16px; height: 16px; padding: 0 5px; border-radius: 8px;
    background: var(--badge); color: #fff; font-size: 10.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; flex-shrink: 0;
  }
  button.item .chev { margin-left: auto; flex-shrink: 0; }

  /* 알림 일시중지 서브메뉴 — 부모 항목 아래에 펼친다. 트레이 근처라 옆으로
     펼치면 화면 밖으로 나가기 쉽다. */
  .sub { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 2px 34px; }
  .sub button {
    border: 0; border-radius: 5px; background: none; font-family: inherit;
    text-align: left; padding: 6px 11px; cursor: default;
    font-size: 12px; font-weight: 400; color: var(--text-3);
  }
  .sub button:hover { background: var(--card-2); }
  .sub button[aria-checked="true"] { color: var(--brand-text); font-weight: 500; }
</style>
</head>
<body>

<div class="menu">
  <div class="who">
    <div class="av-wrap">
      <span class="av" id="me-initial">·</span>
      <span class="presence"></span>
    </div>
    <div class="col">
      <div class="nm" id="me-name">—</div>
      <div class="host" id="me-host"></div>
    </div>
  </div>

  <div class="sep"></div>

  <div class="group">
    <button class="item on" id="btn-open">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      <span class="lbl">just-workspace 열기</span>
    </button>

    <button class="item" id="btn-dnd" aria-expanded="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--icon-strong)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
      <span class="lbl" id="dnd-label">알림 일시중지</span>
      <svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--icon-muted)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <div class="sub" id="dnd-sub" hidden></div>

    <button class="item" id="btn-sync">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      <span class="lbl">동기화</span>
      <span class="right" id="sync-state">—</span>
    </button>

    <button class="item" id="btn-meet" hidden>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--icon-strong)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg>
      <span class="lbl">회의 참가</span>
      <span class="count" id="meet-count">1</span>
    </button>
  </div>

  <div class="sep tight"></div>

  <div class="group">
    <button class="item" id="btn-settings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--icon-strong)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      <span class="lbl">설정</span>
    </button>
    <button class="item" id="btn-quit">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--icon-strong)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4"/><path d="M15 16l4-4-4-4M19 12H9"/></svg>
      <span class="lbl">종료</span>
    </button>
  </div>
</div>

<script src="tray-menu.js"></script>
</body>
</html>
