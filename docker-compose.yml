## ===========================================
## just-workspace — Docker Compose
## ===========================================
## 코어: postgres, redis, backend, frontend-react, nginx (항상 기동)
## 선택: certbot, mailserver, gitea, livekit, audiorelay (COMPOSE_PROFILES로 활성화)
##
## 네트워크: workspace (172.28.0.0/24) 고정 IP
## 외부 접근: nginx :80 단일 진입점 + 메일/SSH/WebRTC 직접 바인딩
##
## 배포 예시:
##   풀스택:      COMPOSE_PROFILES=certbot,mailserver,gitea,livekit
##   최소:        COMPOSE_PROFILES= (코어만)
## ===========================================

services:
  # ─── 1. PostgreSQL 16 (workspace + gitea 공유) ───
  postgres:
    image: postgres:16.16-alpine   # 16 라인 최신 마이너. 17/18 은 pg_upgrade 또는 덤프·복원 필요(별도)
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "random_page_cost=1.1"
    container_name: ws-postgres
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${DB_USER:-workspace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: workspace
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      # -d 를 빼면 pg_isready 는 사용자명과 같은 이름의 DB 로 접속을 시도한다.
      # DB_USER=portal / DB_NAME=workspace 라 매 10초 FATAL 이 찍혔다(로그 7,500건).
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-workspace} -d ${DB_NAME:-workspace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      workspace:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  # ─── 2. Redis 7 ───
  redis:
    image: redis:8.8.4-alpine   # 7.4 RDB/AOF 를 그대로 읽지만 8 에서 저장한 뒤엔 7 로 못 돌아간다(롤백=백업 복원)
    container_name: ws-redis
    command: redis-server --appendonly yes --appendfsync everysec
    security_opt: ["no-new-privileges:true"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    networks:
      workspace:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  # ─── 3. Backend (FastAPI) ───
  backend:
    # prebuilt(pull) + build 겸용. pull 시 JW_REGISTRY/JW_VERSION 지정(미지정=로컬 빌드 태그).
    image: ${JW_REGISTRY:-localhost}/just-workspace-backend:${JW_VERSION:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ws-backend
    security_opt: ["no-new-privileges:true"]
    # Multi-worker so a long-running plugin request can't starve /api/health
    # --proxy-headers: X-Forwarded-For 는 ws-nginx(172.28.0.2 고정, 아래 nginx 서비스) 연결에서 온 것만 믿는다.
    # ws-nginx 가 앞단 리버스 프록시 연결일 때만 실 IP 를 승격하고 XFF 를 덮어써 넘기므로 request.client 가 곧 실 IP 다.
    # 메일(.30)·healthprobe(.74) 처럼 직접 부르는 연결은 연결 주소 그대로 남는다(R7 A2).
    # --timeout-graceful-shutdown: 재시작 때 열린 SSE(내장 AI 이어 받기 구독)를 5초만 기다리고 닫아, docker stop(10초)
    # 안에 종료 훅이 돌아 생성 중 답변을 interrupted 로 저장하게 한다(app/ai/runs.py).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "8",
              "--proxy-headers", "--forwarded-allow-ips", "172.28.0.2", "--timeout-graceful-shutdown", "5"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # 설치된 구역(쉼표 구분 id, backend/app/zones.json). 비우면 전부 — 미설치 구역의 API·백그라운드 작업은 올라오지 않는다.
      JW_ZONES: ${JW_ZONES:-}
      # 브랜드 APK 자동빌드 — 호스트의 리포 경로(docker -v 마운트용). 미설정 시 빌드 비활성.
      JW_HOST_REPO: ${JW_HOST_REPO:-}
      # 격리 브라우저 미러 모드 세션 이미지 — 아래 rbi-mirror 빌드 항목과 같은 이름(백엔드가 세션마다 docker create 한다)
      RBI_MIRROR_IMAGE: ${RBI_MIRROR_IMAGE:-${JW_REGISTRY:-localhost}/just-workspace-rbi-mirror:${JW_VERSION:-latest}}
    extra_hosts:
      # GPU 워크로드를 다른 머신에서 돌리는 경우 GPU_HOST_IP 로 그 호스트를 지정한다.
      # 앱이 VM 안에 있으면 host-gateway 는 VM 의 도커 브리지를 가리켜 GPU 호스트에
      # 닿지 않기 때문이다. (미지정 시 host-gateway — 같은 머신의 Docker Desktop 동작)
      - "host.docker.internal:${GPU_HOST_IP:-host-gateway}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - storage-vol:/storage
      - ${BACKUP_VOLUME:-backups-vol}:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./plugins:/plugins:ro
      # /plugins 아래에 익명 볼륨(node_modules 가리기)을 덧붙이지 말 것 —
      # 리눅스 runc 는 :ro 마운트 안에 마운트포인트를 만들지 못해 backend 가 뜨지 않는다.
      # 업로드 설치 플러그인(플러그앤플레이) — 쓰기가능 볼륨
      - plugins-data:/plugins-data
      # 회의 녹화(Egress) 결과 서빙용 — 읽기전용
      - egress-out:/recordings:ro
      # 격리 브라우저(RBI) netfilter 사이드카의 하트비트(state.json) — 없거나 오래되면 세션을 띄우지 않는다(docs/rbi.md)
      - rbi-guard:/run/rbi-guard:ro
      # 격리 브라우저 동적 출구 허용 목록(allow.txt) — 백엔드가 켜진 대상에서 만들어 쓰고 사이드카가 읽는다(방향이 반대인 볼륨 둘)
      - rbi-allow:/run/rbi-allow
      # AI 파일 도구 — 변환(ws-docconv)·분석 샌드박스(ws-sandbox)의 유닉스 소켓. 두 컨테이너는 네트워크가 없다.
      - docconv-sock:/run/docconv
      - sandbox-sock:/run/sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'
        reservations:
          memory: 512M
    networks:
      workspace:
        ipv4_address: 172.28.0.20
    restart: unless-stopped

  # ─── 4. Frontend (React 정적 빌드) ───
  # 정적 빌드 서빙(포트 3000 워크스페이스 · 3001 격리 브라우저 단독 앱). ws-nginx 의 location / 가 전부 이리로 보낸다.
  # nginx 는 이 컨테이너를 런타임에 찾는다(resolver) — 없거나 내려가 있어도 nginx 자체는 뜬다(그래서 depends_on 에 넣지 않는다).
  # 172.28.0.21 은 비워 둔다(옛 프런트 컨테이너 자리).
  frontend-react:
    image: ${JW_REGISTRY:-localhost}/just-workspace-frontend-react:${JW_VERSION:-latest}
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: ws-frontend-react
    security_opt: ["no-new-privileges:true"]
    expose:
      - "3000"   # 워크스페이스 앱
      - "3001"   # 격리 브라우저 단독 앱(rbi 전용 출처 — ws-nginx rbi server 블록)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      workspace:
        ipv4_address: 172.28.0.22
    restart: unless-stopped

  # ─── 5. Nginx (내장 리버스 프록시, 항상 기동) ───
  nginx:
    image: nginx:1.31.8-alpine
    container_name: ws-nginx
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 공통 보안 헤더 스니펫. conf.d/ 밖에 둔다 — conf.d/*.conf 는 자동 include 라
      # 거기 두면 http 레벨에 중복 적용된다.
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      # 비공개 확장 경로(git 미추적). 없으면 빈 디렉터리가 붙고 include 는 아무것도 안 한다.
      - ./nginx/private.d:/etc/nginx/private.d:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
    networks:
      workspace:
        ipv4_address: 172.28.0.2
    restart: unless-stopped

  # ─── 5-1. Certbot (TLS 인증서 자동 발급/갱신) — profiles: certbot ───
  certbot:
    image: certbot/certbot@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d  # v5.10.0
    container_name: ws-certbot
    security_opt: ["no-new-privileges:true"]
    profiles: ["certbot"]
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./scripts/certbot-entrypoint.sh:/entrypoint.sh:ro
    environment:
      ACME_MODE: webroot
      # 인증서 디렉터리 이름은 첫 번째 이름을 따른다. 설치기가 프로파일에 맞춰 ACME_DOMAINS 를 쓴다.
      # (DNS 가 없는 이름이 하나라도 섞이면 발급이 통째로 실패한다)
      ACME_DOMAINS: ${ACME_DOMAINS:-mail.${DOMAIN:-localhost},turn.${DOMAIN:-localhost},${DOMAIN:-localhost}}
      ACME_EMAIL: ${LETSENCRYPT_EMAIL:-admin@localhost}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    deploy:
      resources:
        limits:
          # 128M 에서는 기동 직후 갱신 때 OOM 이 난다(갱신 중 최대 약 94MB) → 여유 두고 256M.
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 32M
    networks:
      workspace:
        ipv4_address: 172.28.0.3
    restart: unless-stopped

  # ─── 6. Mail Server (Postfix+Dovecot+Rspamd) — profiles: mailserver ───
  mailserver:
    # v16.0.1(Debian 13 / Dovecot 2.4) 릴리스 digest + 데비안 보안 갱신 파생 이미지(mailserver/image/Dockerfile).
    # 다음 DMS 릴리스가 나오면 그 Dockerfile 의 FROM 을 바꾼다.
    image: ${JW_REGISTRY:-localhost}/just-workspace-mailserver:17.0.0-r2-sec
    build:
      context: ./mailserver/image
    container_name: ws-mailserver
    security_opt: ["no-new-privileges:true"]
    hostname: mail.${DOMAIN:-localhost}
    profiles: ["mailserver"]
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "143:143"
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - ./mailserver/config:/tmp/docker-mailserver
      - certbot-data:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      # dovecot 이 로그인마다 백엔드에 비밀번호를 물어보는 데 쓴다(user-patches.sh 의 lua passdb).
      # 비어 있으면 그 passdb 가 통째로 건너뛰어지고 passwd-file 로만 인증한다.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      ENABLE_RSPAMD: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_AMAVIS: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      ENABLE_FAIL2BAN: 0
      RSPAMD_GREYLISTING: 0
      SSL_TYPE: ${MAIL_SSL_TYPE:-letsencrypt}
      POSTMASTER_ADDRESS: postmaster@${DOMAIN:-localhost}
      # 기본 10MB(10240000) — 첨부 50MB 가 base64 로 ~68MB 가 되므로 100MB. 받는 메일에도 같이 적용된다
      POSTFIX_MESSAGE_SIZE_LIMIT: ${MAIL_MESSAGE_SIZE_LIMIT:-104857600}
      PERMIT_DOCKER: none
      ONE_DIR: 1
      OVERRIDE_HOSTNAME: mail.${DOMAIN:-localhost}
    cap_add:
      - NET_ADMIN
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      workspace:
        ipv4_address: 172.28.0.30
    restart: unless-stopped

  # ─── 7. Gitea — profiles: gitea ───
  gitea:
    image: gitea/gitea@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d  # 28.3.0 (1.27.3 에서 DB 마이그레이션 343~357 — 다운그레이드 불가, 되돌리려면 백업 복원)
    container_name: ws-gitea
    security_opt: ["no-new-privileges:true"]
    profiles: ["gitea"]
    ports:
      - "${GIT_SSH_PORT:-2222}:22"
    expose:
      - "3000"
    # SSO OIDC 백채널: 컨테이너가 공인 도메인으로 헤어핀 NAT 을 못 넘는다.
    # 유효 인증서로 워크스페이스를 서빙하는 리버스 프록시의 LAN 주소로 우회한다.
    # 실제 주소는 .env 의 RP_LAN_IP (미설정 시 비활성).
    extra_hosts:
      - "${DOMAIN:-localhost}:${RP_LAN_IP:-127.0.0.1}"
      # 같은 앱을 다른 도메인으로도 서빙할 때(선택). 비우면 존재하지 않는 이름(.invalid)이라 무해하다.
      - "${DOMAIN_ALIAS:-alias.invalid}:${RP_LAN_IP:-127.0.0.1}"
    volumes:
      - ${GITEA_DATA_PATH:-gitea-data}:/data
    environment:
      GITEA__server__ROOT_URL: ${GITEA_EXTERNAL_URL:-${APP_URL:-http://localhost}/git/}
      GITEA__server__SSH_PORT: ${GIT_SSH_PORT:-2222}
      GITEA__server__SSH_DOMAIN: ${DOMAIN:-localhost}
      # SSO 사전구성: FTW 잠금 + 로컬가입 차단, 워크스페이스 OIDC로 자동가입/연동
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__ACCOUNT_LINKING: "auto"
      GITEA__oauth2_client__UPDATE_AVATAR: "true"
      GITEA__oauth2_client__OPENID_CONNECT_SCOPES: "openid email profile"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      workspace:
        ipv4_address: 172.28.0.31
    restart: unless-stopped

  # ─── ws-sso — SSO 프로토콜 계층 (profiles: sso) ───
  # backend 와 분리한 이유는 기능이 아니라 **의존성 충돌**이다:
  #   pysaml2 → pyopenssl<24.3.0 → cryptography<44
  #   backend 는 cryptography 50 (python-jose·Argon2·TLS 검증이 그 위에 있다)
  # 별도 venv = 별도 컨테이너면 강등 없이 공존한다.
  #
  # 이 서비스는 **사용자를 소유하지 않는다.** users 는 backend 가 쓰고 여기선 읽기만
  # 한다. 인증도 하지 않는다 — backend 가 발급한 ws_session 을 검증해 신원만 확인하고
  # SAML/SCIM 형식으로 재발행한다.
  sso:
    image: ${JW_REGISTRY:-localhost}/just-workspace-sso:${JW_VERSION:-latest}
    build:
      context: ./sso
      dockerfile: Dockerfile
    container_name: ws-sso
    security_opt: ["no-new-privileges:true"]
    profiles: ["sso"]
    env_file: .env
    environment:
      # ws_session 서명 검증 — backend 와 반드시 같은 값이어야 한다.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-workspace}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-workspace}
      PUBLIC_URL: ${APP_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sso/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 128M
    networks:
      workspace:
        ipv4_address: 172.28.0.60
    restart: unless-stopped

  # ─── ws-ldap — LDAP 프로바이더 (profiles: sso) ───
  # **우리가 LDAP 서버가 되는 쪽이다.** backend/app/auth/ldap_client.py 는 반대
  # 방향(외부 LDAP 으로 로그인하는 컨슈머)이니 혼동하지 말 것.
  # 대상: NAS · 하이퍼바이저 · 방화벽 · 메일 클라이언트처럼 LDAP 만 받는 장비.
  #
  # ws-sso 와 별도 컨테이너인 이유: 파이썬에 유지되는 asyncio LDAP **서버**
  # 라이브러리가 없어 ldaptor(Twisted)를 써야 하는데, FastAPI(asyncio)와 같은
  # 프로세스에 두면 리액터가 섞인다.
  ldap:
    image: ${JW_REGISTRY:-localhost}/just-workspace-ldap:${JW_VERSION:-latest}
    build:
      context: ./ldap
      dockerfile: Dockerfile
    container_name: ws-ldap
    security_opt: ["no-new-privileges:true"]
    profiles: ["sso"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-workspace}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-workspace}
      BACKEND_URL: http://backend:8000
      # 비밀번호 검증을 backend 에 위임할 때 쓰는 키. 없으면 기동을 거부한다.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required for ws-ldap}
    ports:
      # 컨테이너 안에서는 비루트라 1389/1636 으로 듣고, 밖으로 표준 포트로 낸다.
      - "389:1389"
      - "636:1636"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 자체 서명 LDAPS 인증서 보존. 매 기동마다 새로 만들면 인증서를 신뢰 목록에
      # 넣어둔 장비(NAS·하이퍼바이저 등)가 재기동 때마다 접속에 실패한다.
      - ldap-certs:/certs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      workspace:
        ipv4_address: 172.28.0.61
    restart: unless-stopped

  # ─── 로그 파이프라인 (profiles: logging) ───
  # 컨테이너 로그를 한 곳에 모아 검색하고, 보안 이벤트만 SIEM 으로 흘린다.
  # 이전에는 장애 추적 때마다 docker logs 를 컨테이너별로 따로 돌려야 했고,
  # 요청 하나가 nginx→backend→postgres 를 어떻게 지나갔는지 이어볼 수 없었다.
  #
  # Postgres 의 access_logs/audit_logs 는 **앱 도메인 로그**로 그대로 둔다.
  # 여기(Loki)는 **인프라/런타임 로그** 담당이다 — 역할을 겹치지 않게.

  vector:
    image: timberio/vector:0.61.0-alpine
    container_name: ws-vector
    security_opt: ["no-new-privileges:true"]
    profiles: ["logging"]
    volumes:
      - ./logging/vector/vector.yaml:/etc/vector/vector.yaml:ro
      # 도커 소켓에서 전 컨테이너 로그를 읽는다. 파일을 직접 쫓으면 로테이션·압축
      # 시점에 유실이 생긴다.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    environment:
      # SIEM 연동 시 채운다(vector.yaml 의 siem 싱크 주석 해제와 함께).
      SIEM_HOST: ${SIEM_HOST:-}
      SIEM_PORT: ${SIEM_PORT:-514}
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      workspace:
        ipv4_address: 172.28.0.70
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.10
    container_name: ws-loki
    security_opt: ["no-new-privileges:true"]
    profiles: ["logging"]
    command: -config.file=/etc/loki/loki.yaml
    user: "10001:10001"
    volumes:
      - ./logging/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      workspace:
        ipv4_address: 172.28.0.71
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.6
    container_name: ws-grafana
    security_opt: ["no-new-privileges:true"]
    profiles: ["logging"]
    volumes:
      - ./logging/grafana/provisioning:/etc/grafana/provisioning:ro
      # 대시보드는 **파일로** 관리한다. UI 에서만 만들면 grafana-data 볼륨에만
      # 남아 컨테이너를 다시 만들 때 유실될 수 있다.
      - ./logging/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # ★ 내부망 전용. VM 의 LAN 인터페이스에만 게시하고 인바운드 NAT 을 뚫지
      #   않는다. nginx(공인 경로)로는 서빙하지 않는다 — 관제 화면을 공인망에
      #   두면 인증 하나에만 의존하게 된다.
      - "${GRAFANA_BIND:-127.0.0.1}:3001:3000"
    environment:
      GF_SERVER_ROOT_URL: http://${GRAFANA_BIND:-127.0.0.1}:3001/
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # 익명 접근·가입 차단. 관제 화면이 인증 없이 열리면 안 된다.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # 알림 메일은 **자체 메일서버로 직접** 쏜다. 같은 도커 네트워크이고 수신인이
      # 로컬 도메인이라 인증 없이 받아준다(외부 릴레이가 아니라 자기 도메인 수신).
      # 외부 SMTP 를 쓰면 그게 죽은 날 알림도 같이 죽는데, 하필 그런 날 알림이
      # 가장 필요하다.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "172.28.0.30:25"
      GF_SMTP_FROM_ADDRESS: "grafana@${DOMAIN:-localhost}"
      GF_SMTP_FROM_NAME: "Workspace 감시"
      # HELO 가 컨테이너 ID(점 없음)로 나가면 메일서버가 reject_non_fqdn_helo_hostname 으로 거절 → 알림 메일 전량 불발
      GF_SMTP_EHLO_IDENTITY: "grafana.${DOMAIN:-localhost}"
      GF_SMTP_SKIP_VERIFY: "true"
      # 알림 수신 주소. provisioning/alerting/contactpoints.yaml 이 참조한다.
      ALERT_EMAIL: ${ALERT_EMAIL:-root@localhost}
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      workspace:
        ipv4_address: 172.28.0.72
    restart: unless-stopped

  # ─── Loki 수신 게이트웨이 — profiles: logging ───
  # 다른 호스트의 Vector 가 push 만 하게 하는 입구. 조회 API 는 막고
  # 출발지는 LOKI_PUSH_ALLOW 하나만. 기본 게시는 127.0.0.1(꺼짐과 같음).
  loki-gw:
    image: nginx:1.31.8-alpine
    container_name: ws-loki-gw
    security_opt: ["no-new-privileges:true"]
    profiles: ["logging"]
    volumes:
      - ./logging/loki-gw/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # LOKI_PUSH_ALLOW(쉼표/공백 구분 여러 출발지) → allow 줄 파일. 템플릿보다 먼저 돈다.
      - ./logging/loki-gw/10-push-allow.sh:/docker-entrypoint.d/10-push-allow.sh:ro
    environment:
      # 예: 192.168.10.180,192.168.10.50 (로그를 보내는 다른 호스트)
      LOKI_PUSH_ALLOW: ${LOKI_PUSH_ALLOW:-127.0.0.1}
    ports:
      - "${LOKI_PUSH_BIND:-127.0.0.1}:3102:3100"
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    networks:
      workspace:
        ipv4_address: 172.28.0.75
    restart: unless-stopped

  # ─── 상태 점검 프로브 — profiles: logging ───
  # 조용히 죽는 것들(인증서 갱신, 터널 경로, 파일 색인, 디스크)을 주기적으로
  # 찔러보고 결과를 JSON 한 줄씩 stdout 에 찍는다. Vector 의 docker_logs 가
  # 그걸 그대로 Loki 로 보내므로 수집 경로를 새로 만들 필요가 없다.
  # 패키지는 기동 시 apk 로 받는다 — 이미지를 따로 굽지 않아 CI 를 안 건드린다.
  healthprobe:
    image: alpine:3.24.4
    container_name: ws-healthprobe
    security_opt: ["no-new-privileges:true"]
    profiles: ["logging"]
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl openssl bind-tools coreutils redis postgresql-client >/dev/null 2>&1 ||         apk add --no-cache curl openssl bind-tools coreutils redis >/dev/null 2>&1
        exec /bin/sh /healthprobe/probe.sh
    volumes:
      # 디렉터리째 — 사이트 장비 목록(devices.conf)이 없을 수도 있어서
      # 파일 단위로 걸면 도커가 빈 디렉터리를 만들어 버린다.
      - ./logging/healthprobe:/healthprobe:ro
      # 디스크 사용률을 보려면 실제 데이터가 있는 볼륨을 봐야 한다
      - storage-vol:/storage:ro
    environment:
      PROBE_INTERVAL: "${PROBE_INTERVAL:-300}"
      DOMAIN: ${DOMAIN:-localhost}
      # 사이트 전용 점검(앞단 리버스 프록시 인증서, 터널 경유 경로). 비우면 건너뛴다.
      RP_IP: ${RP_IP:-}
      TUNNEL_IP: ${TUNNEL_IP:-}
      TUNNEL_PROBE_HOST: ${TUNNEL_PROBE_HOST:-}
      NETLAB_HOST: ${NETLAB_HOST:-}
      REDIS_HOST: redis
      PGHOST: postgres
      PGUSER: ${DB_USER:-workspace}
      PGPASSWORD: ${DB_PASSWORD:-}
      PGDATABASE: workspace
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    networks:
      workspace:
        ipv4_address: 172.28.0.74
    restart: unless-stopped

  # ─── 8. LiveKit — profiles: livekit ───
  livekit:
    image: livekit/livekit-server@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20  # v1.13.11
    container_name: ws-livekit
    security_opt: ["no-new-privileges:true"]
    profiles: ["livekit"]
    ports:
      # Docker Desktop 처럼 인바운드 소스 IP 가 브리지 게이트웨이로 SNAT 되는 환경에서는
      # DTLS 가 깨진다(dtls timeout) — 그런 곳에서는 UDP 를 빼고 TCP 로 강제해야 한다.
      - "7882-7892:7882-7892/udp"   # 미디어 (WebRTC 기본 경로)
      - "7881:7881/tcp"             # ICE TCP 폴백
      - "3478:3478/udp"             # 내장 TURN (UDP)
      # 내장 TURN (TLS) — LiveKit 이 443 으로 광고함. standalone(nginx 가 443)은
      # 설치기가 LIVEKIT_TURN_TLS_PUBLISH=127.0.0.1:4443 으로 비켜 둔다.
      - "${LIVEKIT_TURN_TLS_PUBLISH:-443}:443/tcp"
    expose:
      - "7880"
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
      # TURN/TLS 용 인증서. 갱신되면 컨테이너를 재시작해야 새 인증서를 읽는다.
      - certbot-data:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      workspace:
        ipv4_address: 172.28.0.32
    restart: unless-stopped

  # ─── 음성채널 무손실 릴레이(ws-audiorelay) — profiles: audiorelay ───
  # Go 순수 포워더(디코딩 없음). WebSocket 은 ws-nginx 의 /audiorelay/ 로(RP 경유, 어디서나),
  # WebTransport(HTTP/3)는 UDP 4433 을 직접 게시한다 — 외부에서 쓰려면 DNS·인증서·방화벽 DNAT 이 필요하다
  # (audiorelay/PROTOCOL.md §4.2, docs/CONFIG.md). 인증서가 없으면 13일 자가서명(LAN 테스트 전용).
  # 토큰 시크릿(AUDIORELAY_SECRET)은 backend 와 같은 값. DB·Redis 의존 없음.
  audiorelay:
    image: ${JW_REGISTRY:-localhost}/just-workspace-audiorelay:${JW_VERSION:-latest}
    build:
      context: ./audiorelay
      dockerfile: Dockerfile
    container_name: ws-audiorelay
    profiles: ["audiorelay"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: ["ALL"]
    ports:
      - "${AUDIORELAY_WT_PORT:-4433}:4433/udp"   # WebTransport (QUIC). 비우면 WS 만 쓰므로 그대로 둬도 무해
    expose:
      - "8090"                                    # health/info/stats/ws — nginx 가 /audiorelay/ 로 넘긴다
    environment:
      # :? 를 쓰지 않는다 — compose 는 꺼진 프로파일의 필수 변수도 검사해 기존 설치가 깨진다. 비면 릴레이가 기동을 거부한다(로그).
      RELAY_SECRET: ${AUDIORELAY_SECRET:-}
      RELAY_HTTP_ADDR: ":8090"
      RELAY_WT_ADDR: ":4433"
      RELAY_WT_PUBLIC_URL: ${AUDIORELAY_WT_PUBLIC_URL:-}
      RELAY_WT_CERT: ${AUDIORELAY_WT_CERT:-/etc/letsencrypt/live/${DOMAIN}/fullchain.pem}
      RELAY_WT_KEY: ${AUDIORELAY_WT_KEY:-/etc/letsencrypt/live/${DOMAIN}/privkey.pem}
      RELAY_WT_SELF_SIGNED_HOSTS: ${AUDIORELAY_WT_SELF_SIGNED_HOSTS:-127.0.0.1,localhost}
      RELAY_MAX_PEERS_PER_ROOM: "16"
    volumes:
      # LE 인증서(갱신되면 1시간 안에 다시 읽는다). 없으면 자가서명으로 뜬다.
      - certbot-data:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "/audiorelay", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 32M
    networks:
      workspace:
        ipv4_address: 172.28.0.34
    restart: unless-stopped

  # ─── 격리 브라우저(RBI) netfilter 사이드카 — profiles: rbi ───
  # 세션 브리지(RBI_BRIDGE)에서 나가는 트래픽을 허용 목적지로만 묶는 호스트 iptables 규칙을 걸고 5초(RBI_POLL)마다 확인한다.
  # 허용 목적지 = RBI_ALLOW(고정) ∪ 백엔드가 켜진 대상에서 만든 동적 목록(rbi-allow 볼륨, 읽기 전용 — 줄마다 다시 검사).
  # 세션 컨테이너 자체는 백엔드가 docker.sock 으로 띄운다(이 compose 에 없다 — 세션마다 생기고 끝나면 지워진다).
  # host 네트워크 + NET_ADMIN 만 필요하다. 하트비트(rbi-guard 볼륨)가 없거나 오래되면 백엔드가 세션 시작을 거부한다.
  # 규칙·검증 방법: docs/rbi.md
  rbi-netfilter:
    image: ${JW_REGISTRY:-localhost}/just-workspace-rbi-netfilter:${JW_VERSION:-latest}
    build:
      context: ./deploy/rbi-netfilter
    container_name: ws-rbi-netfilter
    profiles: ["rbi"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt: ["no-new-privileges:true"]
    environment:
      # 체인 이름은 명시해야 한다(apply.sh 에 기본값 없음 — 시험이 운영 체인을 건드리지 못하게)
      RBI_CHAIN: WS-RBI
      RBI_BRIDGE: ${RBI_BRIDGE:-br-wsrbi}
      RBI_SUBNET: ${RBI_SUBNET:-172.31.200.0/24}
      RBI_NGINX_IP: "172.28.0.2"
      # 고정 허용(늘 허용, "IP:포트" 쉼표). 대상은 관리 화면에서 더하면 동적 목록으로 따라온다 — 여기는 비워도 된다.
      RBI_ALLOW: ${RBI_ALLOW:-}
      # 동적 목록(백엔드가 씀) · 상한(비면 사설 대역) · 언제나 거부할 CIDR 추가 · 확인 주기
      RBI_ALLOW_FILE: /run/rbi-allow/allow.txt
      RBI_ALLOW_CEILING: ${RBI_ALLOW_CEILING:-}
      RBI_DENY: ${RBI_DENY:-}
      RBI_POLL: "5"
      RBI_STATE_FILE: /run/rbi-guard/state.json
    volumes:
      - rbi-guard:/run/rbi-guard
      - rbi-allow:/run/rbi-allow:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  # ─── 격리 브라우저 미러 모드 세션 이미지 — 빌드 전용(profiles: rbi-build) ───
  # compose 가 띄우는 서비스가 아니다. 백엔드가 미러 모드 세션마다 이 이미지로 컨테이너를 만들고(docker create) 끝나면 지운다.
  # 빌드: docker compose build rbi-mirror  (또는 rbi/mirror/build-image.sh). 내용·잠금·라이선스: rbi/mirror/, docs/rbi.md
  # 실수로 up 해도 아무것도 하지 않게 entrypoint 를 true 로 덮고 네트워크도 없다.
  rbi-mirror:
    image: ${JW_REGISTRY:-localhost}/just-workspace-rbi-mirror:${JW_VERSION:-latest}
    build:
      context: ./rbi/mirror
      target: prod
    profiles: ["rbi-build"]
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  # ─── LiveKit Egress (회의 녹화) — profiles: egress (별도 활성화) ───
  # 헤드리스 크롬으로 룸을 합성 녹화 → egress-out 볼륨에 mp4 저장. redis 로 livekit 과 통신.
  # 리소스 무거움(크롬). livekit 프로필과 함께 켤 때만 의미 있음.
  egress:
    image: livekit/egress:v1.15.0   # v1.14.x 는 크롬 V8 원격 실행 취약점 — 1.15.0 이상
    container_name: ws-egress
    profiles: ["egress"]
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
          db: 0
        api_key: ${LIVEKIT_API_KEY:-devkey}
        api_secret: ${LIVEKIT_API_SECRET:-secret}
        ws_url: ws://livekit:7880
        insecure: true
        log_level: info
    cap_add:
      - SYS_ADMIN            # 헤드리스 크롬(컴포지트 녹화) 필요
    volumes:
      - egress-out:/out
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 룸 합성 녹화 1건이 cpu 4 를 요구한다(egress room_composite_cpu_cost 기본값) — 1.5 면 녹화 요청을 받지 않는다.
          memory: 4G
          cpus: '4'
        reservations:
          memory: 512M
    networks:
      workspace:
        ipv4_address: 172.28.0.33

  # ─── 9. OnlyOffice Document Server — profiles: onlyoffice ───
  onlyoffice:
    # 10.0.0.1 (2026-10-12). 9.4부터 동시접속 제한 없음·단일 프로세스(RabbitMQ/DB 불필요).
    # 되돌리기: 9.4.0.1 = sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
    image: onlyoffice/documentserver@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    container_name: ws-onlyoffice
    security_opt: ["no-new-privileges:true"]
    profiles: ["onlyoffice"]
    expose:
      - "80"
    # WOPI 백채널: 에디터가 wopi_src(공인 도메인)를 되가져올 때 헤어핀 NAT 이 안 되면 RP_LAN_IP 로 우회
    extra_hosts:
      - "${DOMAIN:-localhost}:${RP_LAN_IP:-127.0.0.1}"
      # 같은 앱을 다른 도메인으로도 서빙할 때(선택). 비우면 존재하지 않는 이름(.invalid)이라 무해하다.
      - "${DOMAIN_ALIAS:-alias.invalid}:${RP_LAN_IP:-127.0.0.1}"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice}
      JWT_HEADER: Authorization
      WOPI_ENABLED: "true"
      # 10.0 부터 WOPI 되가져오기(checkFileInfo·GetFile·PutFile)는 사설 주소로 갈 때 그 주소가
      # ipfilter 규칙에 "이름으로" 적혀 있어야만 허용한다(wopi.requireIpFilterRule, 와일드카드 불인정).
      # extra_hosts 로 도메인을 RP_LAN_IP 로 돌리므로 그 주소 하나만 명시 허용 — 사설망 전체를 여는
      # ALLOW_PRIVATE_IP_ADDRESS 보다 좁다. 형식: "allow <주소>;allow all"(뒤의 all 은 기본값 유지).
      IP_FILTER_RULES: "allow ${RP_LAN_IP:-127.0.0.1};allow all"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
    networks:
      workspace:
        ipv4_address: 172.28.0.40
    restart: unless-stopped

  # ─── 11. SearXNG (10번 Collabora 는 제거됨 — OnlyOffice 단일화) — self-hosted metasearch for LLM web_search tool ───
  searxng:
    image: searxng/searxng@sha256:048e613ce4a7ddc35dfb05a0b8ede795a054187b3c3b89518adc37d5e03a8297  # 2026.11.13-219b63b20
    container_name: ws-searxng
    security_opt: ["no-new-privileges:true"]
    profiles: ["aitools"]
    expose:
      - "8080"
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-please-change-this-secret-key-32chars}
    volumes:
      - searxng-config:/etc/searxng
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 64M
    networks:
      workspace:
        ipv4_address: 172.28.0.50
    restart: unless-stopped

  # ─── 12. 문서 변환 (LibreOffice headless + H2Orestart) — AI 도구 files_convert ───
  # 네트워크 없음: 백엔드와는 docconv-sock 볼륨의 유닉스 소켓으로만 말한다(포트 공개·외부 통신 없음).
  docconv:
    image: ${JW_REGISTRY:-localhost}/just-workspace-docconv:${JW_VERSION:-latest}
    build:
      context: ./docconv
      dockerfile: Dockerfile
    container_name: ws-docconv
    profiles: ["aitools"]
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      DOCCONV_TOKEN: ${DOCCONV_TOKEN:-}
      DOCCONV_CONCURRENCY: ${DOCCONV_CONCURRENCY:-2}
      DOCCONV_TIMEOUT: ${DOCCONV_TIMEOUT:-120}
      DOCCONV_MAX_MB: ${DOCCONV_MAX_MB:-100}
    volumes:
      - docconv-sock:/run/docconv
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
          pids: 512
        reservations:
          memory: 256M
    restart: unless-stopped

  # ─── 13. 분석 샌드박스 (격리 Python) — AI 도구 code_run ───
  # 네트워크 없음 + 읽기 전용 루트 + 최소 권한. 서버는 root 로 떠서 요청마다 슬롯별 비루트 uid 로 내려 실행한다
  # (그래서 SETUID·SETGID·CHOWN·KILL 만 남긴다). SANDBOX_TOKEN(.env, 백엔드와 같은 값)이 없으면 모든 실행을 거절한다.
  sandbox:
    image: ${JW_REGISTRY:-localhost}/just-workspace-sandbox:${JW_VERSION:-latest}
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    container_name: ws-sandbox
    profiles: ["aitools"]
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN", "KILL"]
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-2}
      SANDBOX_MAX_TIMEOUT: ${SANDBOX_MAX_TIMEOUT:-120}
      SANDBOX_MEM_MB: ${SANDBOX_MEM_MB:-1536}
    volumes:
      - sandbox-sock:/run/sandbox
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    deploy:
      resources:
        limits:
          memory: 3584M
          cpus: '2.0'
          pids: 256
        reservations:
          memory: 128M
    restart: unless-stopped

networks:
  workspace:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  docconv-sock:
  sandbox-sock:
  vector-data:
  loki-data:
  grafana-data:
  ldap-certs:
  postgres-data:
    name: ws-postgres-data
  redis-data:
    name: ws-redis-data
  storage-vol:
    name: ${STORAGE_VOLUME:-ws-storage-data}
    external: true
  backups-vol:
    name: ws-backups
  plugins-data:
    name: ws-plugins-data
  egress-out:
    name: ws-egress-out
  searxng-config:
    name: ws-searxng-config
  mail-data:
    name: ws-mail-data
  mail-state:
    name: ws-mail-state
  mail-logs:
    name: ws-mail-logs
  gitea-data:
    name: ws-gitea-data
  certbot-data:
    name: ws-certbot-data
  rbi-guard:
    name: ws-rbi-guard
  rbi-allow:
    name: ws-rbi-allow
  certbot-webroot:
    name: ws-certbot-webroot
