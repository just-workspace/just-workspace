## ===========================================
## just-workspace — Docker Compose
## ===========================================
## 코어: postgres, redis, backend, frontend-react, nginx (항상 기동)
## 선택: certbot, mailserver, gitea, livekit, audiorelay (COMPOSE_PROFILES로 활성화)
##
## 네트워크: workspace (기본 172.28.0.0/24) 고정 IP — 다른 대역과 충돌하면 JW_NET_PREFIX 로 앞 세 옥텟을 변경한다(예 172.30.5)
## 주소 배정(호스트 번호): 2~99 서비스 고정 주소 / 100~104 설치 관리자 예약(app/docker_api.py) / 그 밖은 미사용.
##   고정 주소가 필요한 것은 nginx(.2 — backend 의 신뢰 프록시, 격리 브라우저 출구 규칙)이나, 도커는 주소 미지정 컨테이너에
##   가장 낮은 빈 주소를 배정하므로 상주 서비스는 전부 고정 주소를 지정한다(동적 주소가 미기동 서비스의 주소를 선점하는 것을 방지).
##   .3 은 비워 둔다 — 예약 주소 도입 이전의 설치 관리자가 동적으로 점유하던 주소이다.
##   일회용 실행(compose run)은 고정 주소를 승계하지 않도록 `networks: !override` 조각을 추가하여 실행한다.
## 외부 접근: nginx :80 단일 진입점 + 메일/SSH/WebRTC 직접 바인딩
##
## 배포 예시:
##   풀스택:      COMPOSE_PROFILES=certbot,mailserver,gitea,livekit
##   최소:        COMPOSE_PROFILES= (코어만)
## ===========================================

# 컨테이너 로그 로테이션 — 기본(json-file)은 상한이 없어 디스크가 가득 찰 때까지 누적된다. 서비스당 최대 10MB × 5개.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ─── 1. PostgreSQL 16 (workspace + gitea 공유) ───
  postgres:
    image: postgres:16.16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e   # 16 라인 최신 마이너. 17/18 은 pg_upgrade 또는 덤프·복원 필요(별도)
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "random_page_cost=1.1"
    container_name: ws-postgres
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${DB_USER:-workspace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: workspace
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      # -d 를 빼면 pg_isready 는 사용자명과 같은 이름의 DB 로 접속을 시도한다.
      # DB_USER=portal / DB_NAME=workspace 라 매 10초 FATAL 이 찍혔다(로그 7,500건).
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-workspace} -d ${DB_NAME:-workspace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.10
    restart: unless-stopped

  # ─── 2. Redis 7 ───
  redis:
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5   # 7.4 RDB/AOF 를 그대로 읽지만 8 에서 저장한 뒤에는 7 로 복귀할 수 없다(롤백=백업 복원)
    container_name: ws-redis
    logging: *default-logging
    command: redis-server --appendonly yes --appendfsync everysec
    security_opt: ["no-new-privileges:true"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.11
    restart: unless-stopped

  # ─── 3. Backend (FastAPI) ───
  backend:
    # prebuilt(pull) + build 겸용. pull 시 JW_REGISTRY/JW_VERSION 지정(미지정=로컬 빌드 태그).
    image: ${JW_REGISTRY:-localhost}/just-workspace-backend:${JW_VERSION:-latest}
    build:
      context: ./backend
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
      dockerfile: Dockerfile
      # 운영 이미지 — 테스트 도구(pytest·aiosqlite)는 test 대상에만 포함된다(backend/Dockerfile)
      target: runtime
      args:
        # 제품 버전(리포 루트 VERSION). 예: JW_APP_VERSION="$(cat VERSION)" docker compose build backend
        JW_APP_VERSION: ${JW_APP_VERSION:-}
    container_name: ws-backend
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    # Multi-worker so a long-running plugin request can't starve /api/health
    # --proxy-headers: X-Forwarded-For 는 ws-nginx(172.28.0.2 고정, 아래 nginx 서비스) 연결에서 수신한 것만 신뢰한다.
    # ws-nginx 는 프런트 프록시로부터의 연결일 때만 실 IP 를 승격하고 XFF 를 덮어써 전달하므로 request.client 가 곧 실 IP 이다.
    # 메일(.30)처럼 직접 호출하는 연결은 연결 주소가 그대로 유지된다.
    # --timeout-graceful-shutdown: 재시작 시 열린 SSE(내장 AI 이어 받기 구독)를 5초만 대기한 뒤 닫아, docker stop(10초)
    # 안에 종료 훅이 실행되어 생성 중 답변을 interrupted 로 저장하도록 한다(app/ai/runs.py).
    # 워커 수는 entrypoint 가 지정한다: BACKEND_WORKERS, 없으면 CPU 수 기준 min(8, max(2, nproc)).
    # 기동 전에 entrypoint 가 비밀값을 검사하며, 취약한 값·기본값이면 기동하지 않는다(python -m app.cli check-secrets).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "${JW_NET_PREFIX:-172.28.0}.2", "--timeout-graceful-shutdown", "5"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # .env 에 DATABASE_URL 이 없거나 비어 있으면 DB_USER·DB_PASSWORD·DB_NAME 으로 조립한다(비밀번호의 중복 기재 방지).
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${DB_USER:-workspace}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-workspace}}
      BACKEND_WORKERS: ${BACKEND_WORKERS:-}
      # 표시 버전. 이미지에 주입된 값보다 우선한다 — 승격(Beta → Stable)은 이미지를 다시 빌드하지 않으므로 실행 환경에서 지정한다.
      JW_APP_VERSION: ${JW_APP_VERSION:-}
      # 설치된 구역(쉼표 구분 id, backend/app/zones.json). 비우면 전체 — 미설치 구역의 API·백그라운드 작업은 기동하지 않는다.
      JW_ZONES: ${JW_ZONES:-}
      # 브랜드 APK 자동빌드 — 호스트의 리포 경로(docker -v 마운트용). 미설정 시 빌드 비활성.
      JW_HOST_REPO: ${JW_HOST_REPO:-}
      # 격리 브라우저 미러 모드 세션 이미지 — 아래 rbi-mirror 빌드 항목과 동일한 이름(백엔드가 세션마다 docker create 수행)
      RBI_MIRROR_IMAGE: ${RBI_MIRROR_IMAGE:-${JW_REGISTRY:-localhost}/just-workspace-rbi-mirror:${JW_VERSION:-latest}}
    extra_hosts:
      # GPU 워크로드를 다른 머신에서 실행하는 경우 GPU_HOST_IP 로 해당 호스트를 지정한다.
      # 앱이 VM 안에 있으면 host-gateway 는 VM 의 도커 브리지를 가리켜 GPU 호스트에
      # 도달하지 못하기 때문이다. (미지정 시 host-gateway — 같은 머신의 Docker Desktop 동작)
      - "host.docker.internal:${GPU_HOST_IP:-host-gateway}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - storage-vol:/storage
      - ${BACKUP_VOLUME:-backups-vol}:/backups
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./plugins:/plugins:ro
      # /plugins 아래에 익명 볼륨(node_modules 가리기)을 추가하지 말 것 —
      # 리눅스 runc 는 :ro 마운트 안에 마운트포인트를 생성하지 못해 backend 가 기동하지 않는다.
      # 업로드 설치 플러그인(플러그앤플레이) — 쓰기 가능 볼륨
      - plugins-data:/plugins-data
      # 회의 녹화(Egress) 결과 서빙용 — 읽기전용
      - egress-out:/recordings:ro
      # 격리 브라우저(RBI) netfilter 사이드카의 하트비트(state.json) — 없거나 오래되면 세션을 기동하지 않는다(docs/rbi.md)
      - rbi-guard:/run/rbi-guard:ro
      # 격리 브라우저 동적 출구 허용 목록(allow.txt) — 백엔드가 활성화된 대상에서 생성해 기록하고 사이드카가 읽는다(방향이 반대인 볼륨 2개)
      - rbi-allow:/run/rbi-allow
      # AI 파일 도구 — 변환(ws-docconv)·분석 샌드박스(ws-sandbox)의 유닉스 소켓. 두 컨테이너는 네트워크가 없다.
      - docconv-sock:/run/docconv
      - sandbox-sock:/run/sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
          # 비우면(0) CPU 제한 없음. 고정값을 지정하면 코어 수가 그보다 적은 서버에서 컨테이너 생성이 거부된다.
          cpus: '${BACKEND_CPUS:-0}'
        reservations:
          memory: 512M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.20
    restart: unless-stopped

  # ─── 4. Frontend (React 정적 빌드) ───
  # 정적 빌드 서빙(포트 3000 워크스페이스 · 3001 격리 브라우저 단독 앱). ws-nginx 의 location / 가 전부 이 서비스로 전달한다.
  # nginx 는 이 컨테이너를 런타임에 조회한다(resolver) — 없거나 중지 상태여도 nginx 자체는 기동한다(따라서 depends_on 에 포함하지 않는다).
  # 172.28.0.21 은 비워 둔다(이전 프런트 컨테이너 주소).
  frontend-react:
    image: ${JW_REGISTRY:-localhost}/just-workspace-frontend-react:${JW_VERSION:-latest}
    build:
      context: ./frontend-react
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
      dockerfile: Dockerfile
    container_name: ws-frontend-react
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    expose:
      - "3000"   # 워크스페이스 앱
      - "3001"   # 격리 브라우저 단독 앱(rbi 전용 출처 — ws-nginx rbi server 블록)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.22
    restart: unless-stopped

  # ─── 5. Nginx (내장 리버스 프록시, 항상 기동) ───
  nginx:
    image: nginx:1.31.8-alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
    container_name: ws-nginx
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 공통 보안 헤더 스니펫. conf.d/ 밖에 둔다 — conf.d/*.conf 는 자동 include 대상이므로
      # 해당 위치에 두면 http 레벨에 중복 적용된다.
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      # 사이트마다 다른 부분(신뢰 프록시 주소·listen·TLS 인증서·HSTS). 기본 파일은 "앞단 프록시 뒤, 80 평문" 구성.
      - ./nginx/site.d:/etc/nginx/site.d:ro
      # 비공개 확장 경로(git 미추적). 없으면 빈 디렉터리가 마운트되고 include 는 no-op 이다.
      - ./nginx/private.d:/etc/nginx/private.d:ro
      # 정적 점검 페이지 — frontend 컨테이너가 아니라 nginx 가 직접 읽는다(업데이트 중에는 frontend 도 교체 중일 수 있다)
      - ./frontend-react/public/maintenance.html:/etc/nginx/static/maintenance.html:ro
      # 점검 모드 마커(maintenance.on) — 설치 관리자가 업데이트 동안 배치한다. 없으면 빈 폴더가 마운트되며 영향이 없다.
      - ./nginx/state:/etc/nginx/state:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.2
    restart: unless-stopped

  # ─── 5-1. Certbot (TLS 인증서 자동 발급/갱신) — profiles: certbot ───
  certbot:
    image: certbot/certbot@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d  # v5.10.0
    container_name: ws-certbot
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    profiles: ["certbot"]
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./scripts/certbot-entrypoint.sh:/entrypoint.sh:ro
    environment:
      ACME_MODE: webroot
      # 인증서 디렉터리 이름은 첫 번째 이름을 따른다. 설치 관리자가 프로파일에 맞춰 ACME_DOMAINS 를 기록한다.
      # (DNS 가 없는 이름이 하나라도 포함되면 발급 전체가 실패한다)
      ACME_DOMAINS: ${ACME_DOMAINS:-mail.${DOMAIN:-localhost},turn.${DOMAIN:-localhost},${DOMAIN:-localhost}}
      ACME_EMAIL: ${LETSENCRYPT_EMAIL:-admin@localhost}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    deploy:
      resources:
        limits:
          # 128M 에서는 기동 직후 갱신 시 OOM 이 발생한다(갱신 중 최대 약 94MB) → 여유를 두어 256M.
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 32M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.35
    restart: unless-stopped

  # ─── 6. Mail Server (Postfix+Dovecot+Rspamd) — profiles: mailserver ───
  mailserver:
    # v16.0.1(Debian 13 / Dovecot 2.4) 릴리스 digest + 데비안 보안 갱신 파생 이미지(mailserver/image/Dockerfile).
    # 다음 DMS 릴리스 시 해당 Dockerfile 의 FROM 을 변경한다.
    image: ${JW_REGISTRY:-localhost}/just-workspace-mailserver:${JW_VERSION:-latest}
    build:
      context: ./mailserver/image
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
    container_name: ws-mailserver
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    hostname: mail.${DOMAIN:-localhost}
    profiles: ["mailserver"]
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      # IMAP 은 TLS(993)만 게시한다. 평문 143 은 게시하지 않는다(내부망에서는 계속 수신 대기한다).
      - "993:993"
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-logs:/var/log/mail
      - ./mailserver/config:/tmp/docker-mailserver
      - certbot-data:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      # dovecot 이 로그인마다 백엔드에 비밀번호 검증을 요청하는 데 사용한다(user-patches.sh 의 lua passdb).
      # 비어 있으면 해당 passdb 전체를 건너뛰고 passwd-file 로만 인증한다.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      ENABLE_RSPAMD: 1
      ENABLE_OPENDKIM: 0
      ENABLE_OPENDMARC: 0
      ENABLE_AMAVIS: 0
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      ENABLE_FAIL2BAN: 0
      RSPAMD_GREYLISTING: 0
      SSL_TYPE: ${MAIL_SSL_TYPE:-letsencrypt}
      POSTMASTER_ADDRESS: postmaster@${DOMAIN:-localhost}
      # 기본 10MB(10240000) — 첨부 50MB 가 base64 로 ~68MB 가 되므로 100MB. 수신 메일에도 동일하게 적용된다
      POSTFIX_MESSAGE_SIZE_LIMIT: ${MAIL_MESSAGE_SIZE_LIMIT:-104857600}
      PERMIT_DOCKER: none
      ONE_DIR: 1
      OVERRIDE_HOSTNAME: mail.${DOMAIN:-localhost}
    # NET_ADMIN 은 부여하지 않는다 — fail2ban(ENABLE_FAIL2BAN)이 방화벽 규칙을 적용할 때만 필요한 권한이다.
    # fail2ban 을 활성화하려면 여기에 cap_add: [NET_ADMIN] 을 함께 추가한다.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.30
    restart: unless-stopped

  # ─── 7. Gitea — profiles: gitea ───
  gitea:
    # GITEA_IMAGE 를 비우면 아래 고정 버전(검증된 버전)을 사용한다.
    image: ${GITEA_IMAGE:-gitea/gitea@sha256:8967bf9deaf3c5c4adae13519436dc1b20c646ac83fe37ae810c933a1045227d}  # 28.3.0 (1.27.3 에서 DB 마이그레이션 343~357 — 다운그레이드 불가, 롤백 시 백업 복원 필요)
    container_name: ws-gitea
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    profiles: ["gitea"]
    ports:
      - "${GIT_SSH_PORT:-2222}:22"
    expose:
      - "3000"
    # SSO OIDC 백채널: 컨테이너에서 공인 도메인으로의 헤어핀 NAT 이 불가하다.
    # 유효 인증서로 워크스페이스를 서빙하는 리버스 프록시의 LAN 주소로 우회한다.
    # 실제 주소는 .env 의 RP_LAN_IP. 우회할 이름은 HAIRPIN_HOST(비우면 DOMAIN).
    # RP_LAN_IP 를 비우면 해당 이름이 127.0.0.1 로 매핑된다 — 우회가 불필요하면 HAIRPIN_HOST 에 사용하지 않는 이름(예 hairpin-off.invalid)을 지정한다.
    extra_hosts:
      - "${HAIRPIN_HOST:-${DOMAIN:-localhost}}:${RP_LAN_IP:-127.0.0.1}"
      # 동일한 앱을 다른 도메인으로도 서빙하는 경우(선택). 비우면 존재하지 않는 이름(.invalid)이 되어 영향이 없다.
      - "${DOMAIN_ALIAS:-alias.invalid}:${RP_LAN_IP:-127.0.0.1}"
    volumes:
      - ${GITEA_DATA_PATH:-gitea-data}:/data
    environment:
      GITEA__server__ROOT_URL: ${GITEA_EXTERNAL_URL:-${APP_URL:-http://localhost}/git/}
      GITEA__server__SSH_PORT: ${GIT_SSH_PORT:-2222}
      GITEA__server__SSH_DOMAIN: ${GIT_SSH_DOMAIN:-${DOMAIN:-localhost}}
      # SSO 사전구성: FTW 잠금 + 로컬가입 차단, 워크스페이스 OIDC로 자동가입/연동
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__ACCOUNT_LINKING: "auto"
      GITEA__oauth2_client__UPDATE_AVATAR: "true"
      GITEA__oauth2_client__OPENID_CONNECT_SCOPES: "openid email profile"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.31
    restart: unless-stopped

  # ─── ws-sso — SSO 프로토콜 계층 (profiles: sso) ───
  # backend 와 분리한 이유는 기능이 아니라 **의존성 충돌**이다:
  #   pysaml2 → pyopenssl<24.3.0 → cryptography<44
  #   backend 는 cryptography 50 (python-jose·Argon2·TLS 검증이 이에 의존한다)
  # 별도 venv = 별도 컨테이너로 두면 버전 강등 없이 공존한다.
  #
  # 이 서비스는 **사용자를 소유하지 않는다.** users 는 backend 가 기록하며 여기서는 조회만
  # 한다. 인증도 수행하지 않는다 — backend 가 발급한 ws_session 을 검증해 신원만 확인하고
  # SAML/SCIM 형식으로 재발행한다.
  sso:
    image: ${JW_REGISTRY:-localhost}/just-workspace-sso:${JW_VERSION:-latest}
    build:
      context: ./sso
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
      dockerfile: Dockerfile
    container_name: ws-sso
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    profiles: ["sso"]
    env_file: .env
    environment:
      # ws_session 서명 검증 — backend 와 반드시 동일한 값이어야 한다.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-workspace}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-workspace}
      PUBLIC_URL: ${APP_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sso/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 128M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.60
    restart: unless-stopped

  # ─── ws-ldap — LDAP 프로바이더 (profiles: sso) ───
  # **본 서비스가 LDAP 서버 역할을 한다.** backend/app/auth/ldap_client.py 는 반대
  # 방향(외부 LDAP 으로 로그인하는 컨슈머)이므로 혼동하지 말 것.
  # 대상: NAS · 하이퍼바이저 · 방화벽 · 메일 클라이언트처럼 LDAP 만 지원하는 장비.
  #
  # ws-sso 와 별도 컨테이너인 이유: 파이썬에는 유지보수되는 asyncio LDAP **서버**
  # 라이브러리가 없어 ldaptor(Twisted)를 사용해야 하는데, FastAPI(asyncio)와 동일
  # 프로세스에 두면 리액터가 충돌한다.
  ldap:
    image: ${JW_REGISTRY:-localhost}/just-workspace-ldap:${JW_VERSION:-latest}
    build:
      context: ./ldap
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
      dockerfile: Dockerfile
    container_name: ws-ldap
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    profiles: ["sso"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-workspace}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-workspace}
      BACKEND_URL: http://backend:8000
      # 비밀번호 검증을 backend 에 위임할 때 사용하는 키. 없거나 취약하면 ws-ldap 이 기동을 거부한다(로그).
      # :? 를 사용하지 않는다 — compose 는 비활성 프로파일의 필수 변수도 검사한다.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    ports:
      # 컨테이너 안에서는 비루트이므로 1389/1636 으로 수신 대기하고, 외부에는 표준 포트로 게시한다.
      # 외부에 게시하는 것은 LDAPS(636)뿐이다. 평문 389 는 비밀번호가 평문으로 전송되므로 기본적으로 이 서버 자신(루프백)에만 게시한다.
      # 평문만 지원하는 장비가 동일 내부망에 있으면 LDAP_PLAIN_BIND 에 해당 망의 서버 주소를 지정한다(예: 192.168.10.20).
      - "${LDAP_PLAIN_BIND:-127.0.0.1}:389:1389"
      - "636:1636"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # 자체 서명 LDAPS 인증서 보존. 기동마다 새로 생성하면 인증서를 신뢰 목록에
      # 등록한 장비(NAS·하이퍼바이저 등)가 재기동 때마다 접속에 실패한다.
      - ldap-certs:/certs
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.61
    restart: unless-stopped

  # ─── 8. LiveKit — profiles: livekit ───
  livekit:
    image: livekit/livekit-server@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20  # v1.13.11
    container_name: ws-livekit
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    profiles: ["livekit"]
    ports:
      # Docker Desktop 처럼 인바운드 소스 IP 가 브리지 게이트웨이로 SNAT 되는 환경에서는
      # DTLS 가 실패한다(dtls timeout) — 해당 환경에서는 UDP 를 제외하고 TCP 로 강제해야 한다.
      - "7882-7892:7882-7892/udp"   # 미디어 (WebRTC 기본 경로)
      - "7881:7881/tcp"             # ICE TCP 폴백
      - "3478:3478/udp"             # 내장 TURN (UDP)
      # 내장 TURN (TLS) — LiveKit 이 443 으로 광고한다. standalone(nginx 가 443 사용)에서는
      # 설치 관리자가 LIVEKIT_TURN_TLS_PUBLISH=127.0.0.1:4443 으로 변경해 충돌을 피한다.
      - "${LIVEKIT_TURN_TLS_PUBLISH:-443}:443/tcp"
    expose:
      - "7880"
    # 기본 키(devkey/secret)·빈 값·짧은 비밀값으로는 기동하지 않는다 — 해당 키를 아는 누구나 회의 토큰을 생성할 수 있다.
    # (:? 를 사용하지 않는다 — compose 는 비활성 프로파일의 필수 변수도 검사한다.)
    entrypoint:
      - /bin/sh
      - -c
      - |
        k="$${LIVEKIT_API_KEY:-}"; s="$${LIVEKIT_API_SECRET:-}"
        if [ -z "$$k" ] || [ -z "$$s" ] || [ "$$k" = "devkey" ] || [ "$$s" = "secret" ] || [ "$${#s}" -lt 32 ]; then
          echo "[livekit] LIVEKIT_API_KEY / LIVEKIT_API_SECRET 이 비어 있거나 기본값이거나 짧습니다(비밀값 32자 이상) - 시작하지 않습니다" >&2
          exit 1
        fi
        export LIVEKIT_KEYS="$$k: $$s"
        exec /livekit-server "$$@"
      - livekit
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
      # TURN/TLS 용 인증서. 갱신 시 컨테이너를 재시작해야 새 인증서가 적용된다.
      - certbot-data:/etc/letsencrypt:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.32
    restart: unless-stopped

  # ─── 음성채널 무손실 릴레이(ws-audiorelay) — profiles: audiorelay ───
  # Go 순수 포워더(디코딩 없음). WebSocket 은 ws-nginx 의 /audiorelay/ 로 수신하고(RP 경유, 어디서나 접근 가능),
  # WebTransport(HTTP/3)는 UDP 4433 을 직접 게시한다 — 외부에서 사용하려면 DNS·인증서·방화벽 DNAT 이 필요하다
  # (audiorelay/PROTOCOL.md §4.2, docs/CONFIG.md). 인증서가 없으면 13일 자가서명(LAN 테스트 전용).
  # 토큰 시크릿(AUDIORELAY_SECRET)은 backend 와 동일한 값. DB·Redis 의존 없음.
  audiorelay:
    image: ${JW_REGISTRY:-localhost}/just-workspace-audiorelay:${JW_VERSION:-latest}
    build:
      context: ./audiorelay
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
      dockerfile: Dockerfile
    container_name: ws-audiorelay
    logging: *default-logging
    profiles: ["audiorelay"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: ["ALL"]
    ports:
      - "${AUDIORELAY_WT_PORT:-4433}:4433/udp"   # WebTransport (QUIC). 비우면 WS 만 사용하므로 그대로 두어도 무해
    expose:
      - "8090"                                    # health/info/stats/ws — nginx 가 /audiorelay/ 로 전달한다
    environment:
      # :? 를 사용하지 않는다 — compose 는 비활성 프로파일의 필수 변수도 검사하므로 기존 설치가 실패한다. 비어 있으면 릴레이가 기동을 거부한다(로그).
      RELAY_SECRET: ${AUDIORELAY_SECRET:-}
      RELAY_HTTP_ADDR: ":8090"
      RELAY_WT_ADDR: ":4433"
      RELAY_WT_PUBLIC_URL: ${AUDIORELAY_WT_PUBLIC_URL:-}
      RELAY_WT_CERT: ${AUDIORELAY_WT_CERT:-/etc/letsencrypt/live/${DOMAIN}/fullchain.pem}
      RELAY_WT_KEY: ${AUDIORELAY_WT_KEY:-/etc/letsencrypt/live/${DOMAIN}/privkey.pem}
      RELAY_WT_SELF_SIGNED_HOSTS: ${AUDIORELAY_WT_SELF_SIGNED_HOSTS:-127.0.0.1,localhost}
      RELAY_MAX_PEERS_PER_ROOM: "16"
      # 표시 버전(/audiorelay/info). 비우면 빌드 시 주입한 값.
      JW_APP_VERSION: ${JW_APP_VERSION:-}
    volumes:
      # LE 인증서(갱신 시 1시간 이내에 다시 읽는다). 없으면 자가서명으로 기동한다.
      - certbot-data:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "/audiorelay", "-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 32M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.34
    restart: unless-stopped

  # ─── 격리 브라우저(RBI) netfilter 사이드카 — profiles: rbi ───
  # 세션 브리지(RBI_BRIDGE)에서 나가는 트래픽을 허용 목적지로만 제한하는 호스트 iptables 규칙을 적용하고 5초(RBI_POLL)마다 확인한다.
  # 허용 목적지 = RBI_ALLOW(고정) ∪ 백엔드가 활성화된 대상에서 생성한 동적 목록(rbi-allow 볼륨, 읽기 전용 — 줄마다 재검증).
  # 세션 컨테이너 자체는 백엔드가 docker.sock 으로 기동한다(이 compose 에는 없다 — 세션마다 생성되고 종료 시 삭제된다).
  # host 네트워크 + NET_ADMIN 만 필요하다. 하트비트(rbi-guard 볼륨)가 없거나 오래되면 백엔드가 세션 시작을 거부한다.
  # 규칙·검증 방법: docs/rbi.md
  rbi-netfilter:
    image: ${JW_REGISTRY:-localhost}/just-workspace-rbi-netfilter:${JW_VERSION:-latest}
    build:
      context: ./deploy/rbi-netfilter
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
    container_name: ws-rbi-netfilter
    logging: *default-logging
    profiles: ["rbi"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt: ["no-new-privileges:true"]
    environment:
      # 체인 이름은 명시해야 한다(apply.sh 에 기본값 없음 — 시험이 운영 체인을 변경하지 못하도록 하기 위함)
      RBI_CHAIN: WS-RBI
      RBI_BRIDGE: ${RBI_BRIDGE:-br-wsrbi}
      RBI_SUBNET: ${RBI_SUBNET:-172.31.200.0/24}
      RBI_NGINX_IP: "${JW_NET_PREFIX:-172.28.0}.2"
      # 고정 허용(상시 허용, "IP:포트" 쉼표). 대상을 관리 화면에서 추가하면 동적 목록에 반영된다 — 여기는 비워도 무방하다.
      RBI_ALLOW: ${RBI_ALLOW:-}
      # 동적 목록(백엔드가 기록) · 상한(비면 사설 대역) · 항상 거부할 CIDR 추가 · 확인 주기
      RBI_ALLOW_FILE: /run/rbi-allow/allow.txt
      RBI_ALLOW_CEILING: ${RBI_ALLOW_CEILING:-}
      RBI_DENY: ${RBI_DENY:-}
      RBI_POLL: "5"
      RBI_STATE_FILE: /run/rbi-guard/state.json
    volumes:
      - rbi-guard:/run/rbi-guard
      - rbi-allow:/run/rbi-allow:ro
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    restart: unless-stopped

  # ─── 격리 브라우저 미러 모드 세션 이미지 — 빌드 전용(profiles: rbi-build) ───
  # compose 가 기동하는 서비스가 아니다. 백엔드가 미러 모드 세션마다 이 이미지로 컨테이너를 생성하고(docker create) 종료 시 삭제한다.
  # 빌드: docker compose build rbi-mirror  (또는 rbi/mirror/build-image.sh). 내용·잠금·라이선스: rbi/mirror/, docs/rbi.md
  # 실수로 up 하더라도 아무 동작도 하지 않도록 entrypoint 를 true 로 덮어쓰며 네트워크도 없다.
  rbi-mirror:
    image: ${JW_REGISTRY:-localhost}/just-workspace-rbi-mirror:${JW_VERSION:-latest}
    build:
      context: ./rbi/mirror
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
      target: prod
    profiles: ["rbi-build"]
    logging: *default-logging
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  # ─── LiveKit Egress (회의 녹화) — profiles: egress (별도 활성화) ───
  # 헤드리스 크롬으로 룸을 합성 녹화 → egress-out 볼륨에 mp4 저장. redis 로 livekit 과 통신.
  # 리소스 사용량이 큼(크롬). livekit 프로필과 함께 활성화할 때만 유효함.
  egress:
    image: livekit/egress:v1.15.0@sha256:ac244a40268ce1dd1510fbff6eb529609ec68aceff1602343f79be8ca08c355b   # v1.14.x 는 크롬 V8 원격 실행 취약점 — 1.15.0 이상
    container_name: ws-egress
    logging: *default-logging
    profiles: ["egress"]
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
          db: 0
        api_key: ${LIVEKIT_API_KEY:-}
        api_secret: ${LIVEKIT_API_SECRET:-}
        ws_url: ws://livekit:7880
        insecure: true
        log_level: info
        cpu_cost:
          room_composite_cpu_cost: ${EGRESS_ROOM_CPU_COST:-4}
    cap_add:
      - SYS_ADMIN            # 헤드리스 크롬(컴포지트 녹화) 필요
    volumes:
      - egress-out:/out
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 룸 합성 녹화 1건이 cpu 4 를 요구한다(egress room_composite_cpu_cost 기본값) — 1.5 면 녹화 요청을 수락하지 않는다.
          # 상한이 서버의 코어 수를 초과하면 컨테이너 생성이 거부되므로, 코어 4개 미만 서버에서는 설치 관리자가
          # EGRESS_CPUS(코어 수)와 EGRESS_ROOM_CPU_COST(녹화 1건의 요구량)를 낮추어 기록한다 — 녹화 품질은 보장되지 않는다.
          memory: 4G
          cpus: '${EGRESS_CPUS:-4}'
        reservations:
          memory: 512M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.33

  # ─── 9. OnlyOffice Document Server — profiles: onlyoffice ───
  onlyoffice:
    # 10.0.0.1 (2026-10-12). 9.4부터 동시접속 제한 없음·단일 프로세스(RabbitMQ/DB 불필요).
    # 롤백: 9.4.0.1 = sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
    image: onlyoffice/documentserver@sha256:ca17889f10b11141cc6441836aebdd2835cf3e1b49681b2fd6e155c94b7850b3
    container_name: ws-onlyoffice
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    profiles: ["onlyoffice"]
    expose:
      - "80"
    # WOPI 백채널: 에디터가 wopi_src(공인 도메인)를 역으로 요청할 때 헤어핀 NAT 이 불가하면 RP_LAN_IP 로 우회
    extra_hosts:
      - "${HAIRPIN_HOST:-${DOMAIN:-localhost}}:${RP_LAN_IP:-127.0.0.1}"
      # 동일한 앱을 다른 도메인으로도 서빙하는 경우(선택). 비우면 존재하지 않는 이름(.invalid)이 되어 영향이 없다.
      - "${DOMAIN_ALIAS:-alias.invalid}:${RP_LAN_IP:-127.0.0.1}"
    environment:
      JWT_ENABLED: "true"
      # 비어 있으면 편집기가 자체적으로 난수 비밀값을 생성한다 — 이 경우 백엔드와 값이 불일치해 편집기가 연결되지 않는다(안전한 방향).
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: Authorization
      WOPI_ENABLED: "true"
      # 10.0 부터 WOPI 역방향 요청(checkFileInfo·GetFile·PutFile)은 사설 주소로 향할 때 해당 주소가
      # ipfilter 규칙에 "이름으로" 명시되어 있어야만 허용된다(wopi.requireIpFilterRule, 와일드카드 불인정).
      # extra_hosts 로 도메인을 RP_LAN_IP 로 매핑하므로 해당 주소 하나만 명시 허용한다 — 사설망 전체를 허용하는
      # ALLOW_PRIVATE_IP_ADDRESS 보다 범위가 좁다. 형식: "allow <주소>;allow all"(뒤의 all 은 기본값 유지).
      IP_FILTER_RULES: "allow ${RP_LAN_IP:-127.0.0.1};allow all"
      # 편집기가 접속 주소(extra_hosts 로 내부망의 nginx 를 가리킨다)로 문서를 되가져올 때의 인증서 검증 생략 여부.
      # 접속 주소의 인증서가 임시(자체 서명)이거나 사설 CA 발급이면 검증에 실패하여 편집기가 열리지 않으므로,
      # 설치 관리자가 해당 구성에서만 true 로 기록한다. 공인 인증서 구성에서는 false(검증 수행).
      USE_UNAUTHORIZED_STORAGE: "${ONLYOFFICE_ALLOW_UNTRUSTED_CERT:-false}"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.5'
        reservations:
          memory: 512M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.40
    restart: unless-stopped

  # ─── 11. SearXNG (10번 Collabora 는 제거됨 — OnlyOffice 단일화) — self-hosted metasearch for LLM web_search tool ───
  searxng:
    image: searxng/searxng@sha256:048e613ce4a7ddc35dfb05a0b8ede795a054187b3c3b89518adc37d5e03a8297  # 2026.11.13-219b63b20
    container_name: ws-searxng
    logging: *default-logging
    security_opt: ["no-new-privileges:true"]
    profiles: ["aitools"]
    expose:
      - "8080"
    # 비밀값이 비어 있으면 기동하지 않는다(알려진 기본값으로 기동하는 상황 방지).
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${SEARXNG_SECRET:-}" ]; then
          echo "[searxng] SEARXNG_SECRET 이 비어 있습니다 - 시작하지 않습니다" >&2
          exit 1
        fi
        exec /usr/local/searxng/entrypoint.sh "$$@"
      - searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - searxng-config:/etc/searxng
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 64M
    networks:
      workspace:
        ipv4_address: ${JW_NET_PREFIX:-172.28.0}.50
    restart: unless-stopped

  # ─── 12. 문서 변환 (LibreOffice headless + H2Orestart) — AI 도구 files_convert ───
  # 네트워크 없음: 백엔드와는 docconv-sock 볼륨의 유닉스 소켓으로만 통신한다(포트 공개·외부 통신 없음).
  docconv:
    image: ${JW_REGISTRY:-localhost}/just-workspace-docconv:${JW_VERSION:-latest}
    build:
      context: ./docconv
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
      dockerfile: Dockerfile
    container_name: ws-docconv
    logging: *default-logging
    profiles: ["aitools"]
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      DOCCONV_TOKEN: ${DOCCONV_TOKEN:-}
      DOCCONV_CONCURRENCY: ${DOCCONV_CONCURRENCY:-2}
      DOCCONV_TIMEOUT: ${DOCCONV_TIMEOUT:-120}
      DOCCONV_MAX_MB: ${DOCCONV_MAX_MB:-100}
    volumes:
      - docconv-sock:/run/docconv
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
          pids: 512
        reservations:
          memory: 256M
    restart: unless-stopped

  # ─── 13. 분석 샌드박스 (격리 Python) — AI 도구 code_run ───
  # 네트워크 없음 + 읽기 전용 루트 + 최소 권한. 서버는 root 로 기동해 요청마다 슬롯별 비루트 uid 로 권한을 낮춰 실행한다
  # (따라서 SETUID·SETGID·CHOWN·KILL 만 유지한다). SANDBOX_TOKEN(.env, 백엔드와 동일한 값)이 없으면 모든 실행을 거부한다.
  sandbox:
    image: ${JW_REGISTRY:-localhost}/just-workspace-sandbox:${JW_VERSION:-latest}
    build:
      context: ./sandbox
      additional_contexts:
        licenses: .          # LICENSE · NOTICE · THIRD_PARTY_LICENSES.md → 이미지의 /licenses/
      dockerfile: Dockerfile
    container_name: ws-sandbox
    logging: *default-logging
    profiles: ["aitools"]
    network_mode: none
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN", "KILL"]
    tmpfs:
      - /tmp:size=1g,mode=1777
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-2}
      SANDBOX_MAX_TIMEOUT: ${SANDBOX_MAX_TIMEOUT:-120}
      SANDBOX_MEM_MB: ${SANDBOX_MEM_MB:-1536}
    volumes:
      - sandbox-sock:/run/sandbox
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    deploy:
      resources:
        limits:
          memory: 3584M
          cpus: '2.0'
          pids: 256
        reservations:
          memory: 128M
    restart: unless-stopped

networks:
  workspace:
    driver: bridge
    ipam:
      config:
        - subnet: ${JW_NET_PREFIX:-172.28.0}.0/24

volumes:
  docconv-sock:
  sandbox-sock:
  ldap-certs:
  postgres-data:
    name: ws-postgres-data
  redis-data:
    name: ws-redis-data
  storage-vol:
    name: ${STORAGE_VOLUME:-ws-storage-data}
    external: true
  backups-vol:
    name: ws-backups
  plugins-data:
    name: ws-plugins-data
  egress-out:
    name: ws-egress-out
  searxng-config:
    name: ws-searxng-config
  mail-data:
    name: ws-mail-data
  mail-state:
    name: ws-mail-state
  mail-logs:
    name: ws-mail-logs
  gitea-data:
    name: ws-gitea-data
  certbot-data:
    name: ws-certbot-data
  rbi-guard:
    name: ws-rbi-guard
  rbi-allow:
    name: ws-rbi-allow
  certbot-webroot:
    name: ws-certbot-webroot
