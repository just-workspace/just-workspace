# frontend-react 컨테이너 내부 정적 서버. 보안 헤더·CSP 는 상위 ws-nginx 가 추가한다.
server {
    listen 3000;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json;

    # 해시 파일명 자산 → 장기 캐시. 존재하지 않는 자산은 index.html 로 fallback 하지 않고 404 반환.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 서비스 워커·매니페스트는 항상 최신본 제공
    location ~ ^/(sw\.js|workbox-[^/]+\.js|registerSW\.js|manifest\.webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # SPA: 나머지 경로는 index.html(라우터가 404 를 그린다). HTML 은 캐시하지 않음.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}

# 격리 브라우저 단독 앱(dist-rbi) — ws-nginx 의 rbi 전용 출처 server 블록만 본 서버로 전달된다(/ · /assets/ · /icon.svg).
# 워크스페이스 번들과 디렉터리가 상이하여 rbi 출처에서는 워크스페이스 자산 수신이 불가하다. 보안 헤더·CSP 는 상위 ws-nginx 가 추가한다.
server {
    listen 3001;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/rbi;
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /icon.svg {
        try_files $uri =404;
    }
    location = / {
        try_files /rbi.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location / {
        return 404;
    }
}
