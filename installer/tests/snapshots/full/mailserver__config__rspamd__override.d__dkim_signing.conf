# 설치 관리자가 만든 파일입니다 — 손으로 고치지 마세요(다음 적용 때 덮어씁니다).
enabled = true;
sign_authenticated = true;
sign_local = true;
use_domain = "header";
use_redis = false;
use_esld = true;
check_pubkey = false;
domain {
    example.com {
        path = "/etc/rspamd/jw-dkim/default.private";
        selector = "default";
    }
}
