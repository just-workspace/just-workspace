# 알림 라우팅.
#
# 규칙이 몇 개 안 되고 수신자도 한 명이라 분기를 두지 않는다. 전부 메일 하나로.
# 대신 반복 간격을 심각도로 나눈다 — critical 은 고쳐질 때까지 계속 찌르고,
# warning 은 하루 한 번만 다시 알린다. 경고가 너무 자주 오면 사람이 메일함
# 규칙으로 걸러버리는데, 그 순간 감시는 없는 것과 같아진다.
apiVersion: 1

policies:
  - orgId: 1
    receiver: workspace-mail
    group_by:
      - alertname
      - target
    # 같은 묶음의 첫 알림을 30초 모았다 보낸다(동시에 깨진 것들을 한 통으로)
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
    routes:
      - receiver: workspace-mail
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 30s
        group_interval: 5m
        # 끊긴 채로 방치되지 않게 4시간마다 다시 알린다
        repeat_interval: 4h
