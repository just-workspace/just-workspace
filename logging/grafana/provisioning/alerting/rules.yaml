# 알림 규칙.
#
# 고르는 기준은 하나다: **조용히 죽어서 아무도 모르는 것.**
# 시끄럽게 죽는 것(사이트가 안 열린다 등)은 사람이 먼저 안다. 알림이 필요한 건
# 몇 달 동안 아무 소리 없이 실패를 반복하던 것들이다.
#
# 각 규칙은 Loki 질의(A) → reduce(B) → threshold(C) 세 단계다. Loki 는
# 시계열 DB 가 아니라 한 번 줄여야 임계값을 걸 수 있다.
apiVersion: 1

groups:
  - orgId: 1
    name: health
    folder: Workspace
    interval: 5m
    rules:
      # ── 프로브 자체가 죽었나 (감시자를 감시한다) ──
      # 이게 없으면 프로브가 멈춘 순간 모든 알림이 조용해지고, 그 침묵이
      # "전부 정상"과 구분되지 않는다. 가장 중요한 규칙이다.
      - uid: ws-probe-down
        title: 상태 점검 프로브 정지
        condition: C
        for: 10m
        annotations:
          summary: ws-healthprobe 가 15분째 아무것도 보고하지 않습니다. 감시가 멈췄습니다.
          runbook: 'docker logs ws-healthprobe / docker compose up -d healthprobe'
        labels:
          severity: critical
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'sum(count_over_time({service="ws-healthprobe"} [15m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }

      # ── 점검 실패 ──
      - uid: ws-check-failing
        title: 상태 점검 실패
        condition: C
        for: 10m
        annotations:
          summary: '최근 15분 동안 점검 {{ printf "%.0f" $values.B.Value }}번이 실패했습니다(오류·심각).'
          runbook: '/d/ws-health'   # annotation 은 env 치환이 안 된다 — Grafana 기준 상대경로
        labels:
          severity: critical
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              # 장비(device)·방화벽(fw) 행은 아래 devices 그룹이 따로 알린다 — 여기서 빼야 같은 고장이 두 통 간다
              # by (check, target, name) — 어느 점검이 실패하는지 메일에 이름으로 나오게 항목별로 나눈다
              expr: 'sum by (check, target, name) (count_over_time({service="ws-healthprobe"} | json | check !~ "device|fw" | status =~ "error|critical" [15m]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }

      # ── 인증서 만료 임박 ──
      # 실제 서빙되는 인증서 기준. mail 인증서가 몇 달째 갱신 실패 중이던 걸
      # 만료 2주 전에야 발견한 적이 있다.
      - uid: ws-cert-expiring
        title: 인증서 만료 임박
        condition: C
        for: 30m
        annotations:
          summary: '실제로 내보내는 인증서가 {{ printf "%.0f" $values.B.Value }}일 뒤 만료됩니다(기준 21일). certbot 갱신 로그와 nginx 리로드를 확인하세요.'
          runbook: 'docker logs ws-certbot | grep -i renew'
        labels:
          severity: warning
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'min by (target, name) (last_over_time({service="ws-healthprobe"} | json | check = "cert" | unwrap value | __error__ = "" [2h]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [21] }

      # ── 파일 색인기 정지 ──
      # 주기는 15분. 60분 넘게 하트비트가 없으면 멈춘 것이다.
      - uid: ws-indexer-stalled
        title: 파일 색인기 정지
        condition: C
        for: 15m
        annotations:
          summary: '색인기가 {{ printf "%.0f" $values.B.Value }}분째 돌지 않았습니다(주기 15분, 기준 60분). 검색 결과가 낡아갑니다.'
          runbook: 'docker logs ws-backend | grep -i 색인'
        labels:
          severity: warning
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 7200, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'max(last_over_time({service="ws-healthprobe"} | json | check = "index" | target = "indexer" | unwrap value [2h]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [60] }

      # ── 디스크 ──
      - uid: ws-disk-full
        title: 디스크 임계
        condition: C
        for: 15m
        annotations:
          summary: '/storage 사용률 {{ printf "%.0f" $values.B.Value }}% (기준 90%). 메일 아카이브와 첨부가 쌓이는 곳입니다.'
          runbook: 'df -h /storage'
        labels:
          severity: critical
        noDataState: NoData
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'max(last_over_time({service="ws-healthprobe"} | json | check = "disk" | unwrap value [1h]))'
          - refId: B
            datasourceUid: __expr__
            model: { refId: B, type: reduce, expression: A, reducer: last }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [90] }

  # ── 연결 장비 (ws-healthprobe 의 check=device) ──
  # 알림 템플릿의 $labels 와 math 식의 $C 는 $ 하나로 쓴다. Grafana 13 은 ${VAR} 만 환경변수로
  # 치환하고, $$ 이스케이프는 풀지 않고 그대로 남겨 math 식이 깨진다.
  - orgId: 1
    name: devices
    folder: Workspace
    interval: 1m
    rules:
      # 다운 2회 연속 = 창(11분) 안의 보고가 전부 다운이고 2건 이상. 5분 주기 점검은 2~3건이
      # 전부 다운이어야 한다. alert="0" 행(다른 규칙이 이미
      # 알리는 고장)은 뺀다.
      - uid: ws-device-down
        title: 연결 장비 다운
        condition: E
        for: 0s
        annotations:
          summary: '최근 11분 동안 {{ printf "%.0f" $values.D.Value }}번 점검해 한 번도 응답하지 않았습니다.'
          runbook: '/d/ws-health'
        labels:
          severity: critical
        noDataState: OK
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange: { from: 660, to: 0 }
            datasourceUid: loki
            model:
              refId: A
              queryType: instant
              expr: 'min by (dev, target, name) (min_over_time({service="ws-healthprobe"} | json | label_format name="{{ or .name .target }}" | check = "device" | alert = "1" | unwrap code | __error__ = "" [11m]))'
          - refId: B
            relativeTimeRange: { from: 660, to: 0 }
            datasourceUid: loki
            model:
              refId: B
              queryType: instant
              expr: 'sum by (dev, target, name) (count_over_time({service="ws-healthprobe"} | json | label_format name="{{ or .name .target }}" | check = "device" | alert = "1" | __error__ = "" [11m]))'
          - refId: C
            datasourceUid: __expr__
            model: { refId: C, type: reduce, expression: A, reducer: last }
          - refId: D
            datasourceUid: __expr__
            model: { refId: D, type: reduce, expression: B, reducer: last }
          - refId: E
            datasourceUid: __expr__
            model: { refId: E, type: math, expression: '$C >= 2 && $D >= 2' }
