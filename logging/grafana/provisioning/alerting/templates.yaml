# 알림 메일 본문·제목.
#
# 기본 메일은 라벨(dev=network, target=gateway)과 식 값(C=2, D=3)을 그대로 보여 줘서
# "무엇이 어떻게 됐는지"를 사람이 다시 풀어야 했다. 여기서는 한 건마다
#   이름(프로브가 싣는 한글 name) · 무슨 알림인지 · 지금 상태(값을 문장으로 쓴 summary) · 언제부터
# 를 쓴다. 값을 문장으로 바꾸는 건 각 규칙의 summary 가 맡는다(rules.yaml).
apiVersion: 1

templates:
  - orgId: 1
    name: ws-mail
    template: |
      {{ define "ws.name" }}{{ if .Labels.name }}{{ .Labels.name }}{{ else if .Labels.target }}{{ .Labels.target }}{{ else }}{{ .Labels.alertname }}{{ end }}{{ end }}

      {{ define "ws.dev" }}{{ if eq . "network" }}네트워크{{ else if eq . "vm" }}VM 서비스{{ else if eq . "mail" }}메일{{ else if eq . "dns" }}DNS{{ else if eq . "firewall" }}방화벽{{ else if eq . "rp" }}리버스 프록시{{ else }}{{ . }}{{ end }}{{ end }}

      {{ define "ws.when" }}{{ . | tz "Asia/Seoul" | date "01-02 15:04" }}{{ end }}

      {{ define "ws.subject" }}{{ if .Alerts.Firing }}[장애]{{ else }}[복구]{{ end }} {{ with index .Alerts 0 }}{{ template "ws.name" . }} — {{ .Labels.alertname }}{{ end }}{{ if gt (len .Alerts) 1 }} 외 {{ len (slice .Alerts 1) }}건{{ end }}{{ end }}

      {{ define "ws.message" }}{{ if .Alerts.Firing }}지금 문제 {{ len .Alerts.Firing }}건
      {{ range .Alerts.Firing }}
      ■ {{ template "ws.name" . }}{{ if eq .Labels.severity "critical" }} [심각]{{ else }} [주의]{{ end }}
      · 알림: {{ .Labels.alertname }}{{ if .Labels.dev }} ({{ template "ws.dev" .Labels.dev }}){{ end }}
      · 상태: {{ .Annotations.summary }}
      · 시작: {{ template "ws.when" .StartsAt }} (한국 시각)
      {{ if and .Annotations.runbook (ne .Annotations.runbook "/d/ws-health") }}· 확인: {{ .Annotations.runbook }}
      {{ end }}{{ if .Labels.target }}· 점검 이름: {{ .Labels.target }}
      {{ end }}{{ end }}{{ end }}{{ if .Alerts.Resolved }}
      복구 {{ len .Alerts.Resolved }}건
      {{ range .Alerts.Resolved }}
      ✔ {{ template "ws.name" . }} — {{ .Labels.alertname }} 해소
      · 기간: {{ template "ws.when" .StartsAt }} ~ {{ template "ws.when" .EndsAt }} (한국 시각)
      {{ end }}{{ end }}
      대시보드: {{ reReplaceAll "/$" "" .ExternalURL }}/d/ws-health{{ end }}
