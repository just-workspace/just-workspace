# 대시보드 자동 등록. 파일로 관리해야 컨테이너를 다시 만들어도 살아남는다
# (UI 에서 만든 대시보드는 grafana-data 볼륨에만 있어 유실 위험이 있다).
apiVersion: 1
providers:
  - name: workspace
    orgId: 1
    folder: Workspace
    type: file
    disableDeletion: false
    # UI 에서 고친 내용이 파일로 덮어써지지 않게 한다. 대신 파일 변경은 반영된다.
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
