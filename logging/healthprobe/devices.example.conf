# 연결 장비 목록 예시 — 실제 파일은 devices.conf (사이트 전용, 코어 .gitignore).
# 형식: <묶음> <이름> <종류> <인자...> [noalert]
#   ping <호스트> | tcp <호스트> <포트> | http <URL> [기대코드정규식] [host:port:addr] | dns <서버> <이름> [기대응답정규식]
# noalert = 장비 다운 알림에서 뺀다(다른 규칙이 이미 알리는 고장).
# 줄 끝 "# 이름" = 알림 메일·표에 보일 한글 이름(앞뒤 공백 필수).
network  gateway       ping 192.0.2.1            # 방화벽 게이트웨이
network  gateway-web   tcp  192.0.2.1 443
network  nas           http https://192.0.2.10/ ^(2|3|4)
vm       reverse-proxy http https://192.0.2.20/ ^(2|3|4)   # 리버스 프록시
vm       dns-filter    dns  192.0.2.30 example.com
mail     smtp          tcp  172.28.0.30 25
mail     submission    tcp  172.28.0.30 587
mail     imaps         tcp  172.28.0.30 993
dns      public        dns  1.1.1.1 example.com
