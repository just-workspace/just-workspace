# Loki — 로그 저장소. 단일 노드(monolithic) 모드.
#
# 우리 규모(컨테이너 16개, 하루 수십MB)에서는 마이크로서비스 배포가 과하다.
# 파일시스템 백엔드로 충분하고, 나중에 커지면 S3/NAS 로 바꾸면 된다.

auth_enabled: false          # 단일 테넌트. nginx 뒤에 두고 외부 노출하지 않는다.

server:
  http_listen_port: 3100
  log_level: warn            # Loki 자기 로그가 시끄러우면 수집 대상과 섞인다

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # 우리는 단일 조직이라 제한을 넉넉히 준다. 기본값은 SaaS 기준이라 너무 빡빡하다.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 5000
  # 과거 로그도 받아준다 — 컨테이너 재기동 시 밀린 로그가 들어올 수 있다.
  reject_old_samples: false
  # ★ 보존 기간. access_logs(Postgres)가 90일이라 맞춘다.
  retention_period: 2160h    # 90일

compactor:
  working_directory: /loki/compactor
  # 보존 기간이 지난 청크를 실제로 지운다. 이게 없으면 retention_period 는
  # 조회만 막고 디스크는 계속 찬다.
  retention_enabled: true
  delete_request_store: filesystem

# 단일 노드에서는 규칙 평가·알림을 쓰지 않는다(필요해지면 Grafana 알림으로).
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
