# Vector — 로그 수집·가공·분배.
#
# 왜 Vector 인가: 입력 하나를 **여러 목적지로 동시에** 보낼 수 있다.
# Loki(검색용)와 SIEM(보안관제용)은 요구가 다른데, 수집기를 두 번 돌리면
# 로그가 갈라져 상관분석이 깨진다. Vector 는 한 파이프라인에서 갈래를 친다.
#
# 라이선스 MPL-2.0 (permissive).

data_dir: /var/lib/vector

sources:
  # 도커 소켓에서 전 컨테이너 stdout/stderr 를 읽는다.
  # 파일(/var/lib/docker/containers)을 직접 읽지 않는 이유: 로테이션·압축이
  # 걸려 있어 파일을 쫓으면 압축 시점에 유실이 생긴다. 소켓은 그 영향을 안 받는다.
  docker:
    type: docker_logs
    exclude_containers:
      - ws-vector      # 자기 로그를 자기가 먹는 순환 방지
      - ws-loki        # Loki 가 수집 실패를 로그로 남기면 무한 증폭된다
      - ws-grafana

transforms:
  # 컨테이너 이름에서 서비스명을 뽑고, 나중에 라벨로 쓴다.
  # ★ Loki 라벨은 **카디널리티가 낮아야** 한다. request_id 같은 걸 라벨로 넣으면
  #   스트림이 폭발해 저장소가 망가진다. 그런 값은 본문에 두고 검색으로 찾는다.
  enrich:
    type: remap
    inputs: [docker]
    source: |
      .service = replace(string!(.container_name), r'^/', "")
      .host = "ws"

      # 쿼리스트링 비밀값 마스킹 — nginx error_log 의 request: 필드는 쿼리를 통째로 남긴다
      # (옛 클라이언트 /ws/chat?token=…, WOPI access_token=…). Loki·SIEM 으로 평문이 넘어가지 않게.
      .message = replace(string!(.message), r'(?i)(token|access_token|ws_token)=[^&\s"]+', "$$1=[REDACTED]")

      # 수준 추정 — 컨테이너마다 포맷이 달라 완벽하진 않다. 대략적인 필터용이다.
      msg = downcase(string!(.message))
      if match(msg, r'\b(fatal|panic|critical)\b') {
        .level = "critical"
      } else if match(msg, r'\b(error|exception|traceback)\b') {
        .level = "error"
      } else if match(msg, r'\bwarn(ing)?\b') {
        .level = "warn"
      } else {
        .level = "info"
      }

  # SIEM 으로는 **전량이 아니라 보안 관련만** 보낸다. 전량을 보내면 상대 쪽
  # 라이선스(EPS 과금)와 대역을 잡아먹고, 정작 중요한 신호가 묻힌다.
  security_events:
    type: filter
    inputs: [enrich]
    condition: |
      .level == "critical" ||
      .level == "error" ||
      match(string!(.message), r'(?i)(unauthorized|forbidden|invalid credentials|bind 실패|authentication fail|permission denied|403|401)')

sinks:
  loki:
    type: loki
    inputs: [enrich]
    endpoint: http://loki:3100
    encoding:
      codec: text
    # 라벨은 저카디널리티만. service/level/host 셋으로 충분하다.
    labels:
      service: "{{ service }}"
      level: "{{ level }}"
      host: "{{ host }}"
    out_of_order_action: accept
    remove_label_fields: true

  # SIEM 연동 — 기본은 꺼둔다(설정 후 활성화).
  # 방화벽 로그 서버·Splunk·QRadar 등 대부분 syslog(RFC 5424)를 받는다.
  # 활성화하려면 SIEM_HOST 를 채우고 이 싱크의 주석을 풀 것.
  #
  # siem:
  #   type: socket
  #   inputs: [security_events]
  #   mode: tcp
  #   address: "${SIEM_HOST}:${SIEM_PORT:-514}"
  #   encoding:
  #     codec: json

  # 운영 중 눈으로 확인할 때 쓰는 출구. 평소엔 주석.
  # debug:
  #   type: console
  #   inputs: [security_events]
  #   encoding:
  #     codec: json
