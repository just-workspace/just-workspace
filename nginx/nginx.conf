# just-workspace — Nginx reverse proxy

# 액세스 로그 — 쿼리스트링 제외.
# 기본 combined 포맷의 "$request" 에는 쿼리스트링 전체가 포함된다. WOPI 규격상
# access_token 이, 비밀번호 재설정 링크에는 token 이 쿼리로 전달되므로 그대로 두면
# 평문 토큰이 Docker json 로그로 디스크에 상주한다.
# $request_uri 가 아닌 $uri 를 사용해야 쿼리가 제외된다.
log_format  privacy  '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── 클라이언트 IP 신뢰 경계 ───
# 신뢰 프록시 = 프런트 리버스 프록시(RP) — 주소는 site.d/http.conf 의 set_real_ip_from 에 기재한다(리포 기본값 192.168.10.50 은 예시).
# 연결 주소가 해당 주소일 때만 X-Real-IP 를 클라이언트 IP 로
# 승격한다(RP 는 X-Real-IP 를 $remote_addr 로 덮어써 전송한다). 그 밖의 접속(LAN 직접,
# 동일 VM 의 러너 등)은 전송된 헤더를 무시하고 연결 주소를 그대로 사용한다.
# 이후 $remote_addr(접속 로그·limit_req 키)는 이미 실제 IP 이며, 업스트림으로 전달할 때는
# X-Real-IP·X-Forwarded-For 를 이어 붙이지 않고 **덮어쓴다** — 클라이언트가 보낸
# XFF 첫 값이 백엔드까지 전달되어 감사 로그를 위조하던 경로를 차단한다.
# 사이트별로 상이한 부분(신뢰 프록시 주소, TLS 인증서, 80 → 443 전환)은 site.d/ 에 둔다 — 이 파일은 모든 설치에서 동일하다.
# site.d/ 의 기본 파일은 "앞단 프록시 뒤, 80 평문" 구성이며, 설치 관리자는 응답 내용에 맞춰 해당 네 파일만 재작성한다(docs/installer.md).
include /etc/nginx/site.d/http.conf;
real_ip_header    X-Real-IP;
real_ip_recursive off;

# TLS 는 프런트 리버스 프록시가 종단한다 → 여기서 $scheme 은 항상 http 이다.
# 원본 스킴은 RP 가 전달한 X-Forwarded-Proto 를 그대로 승계해야 한다.
# OnlyOffice 는 이 값으로 에디터가 재요청할 절대 URL(cache/files/.../Editor.bin)을
# 생성하며, http 로 생성되면 브라우저가 Mixed Content 로 차단해 "Download failed" 가 표시된다.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ─── Rate Limiting ───
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dav:10m rate=10r/s;

# ─── Gzip 압축 ───
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

# ─── Workspace (HTTP-only, SSL은 외부 nginx 담당) ───
server {
    include /etc/nginx/site.d/listen-main.conf;   # 기본: listen 80 default_server; (TLS 를 직접 종단하면 443 ssl)
    server_name _;
    access_log /var/log/nginx/access.log privacy;
    server_tokens off;

    # ─── 보안 헤더 ───
    # 공통 항목은 security-headers.conf 로 분리했다. add_header 를 사용하는 location 은
    # 상속이 차단되므로 해당 location 에서도 동일 파일을 include 해야 한다(파일 주석 참고).
    include /etc/nginx/security-headers.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ─── CSP: 현재 Report-Only ───
    # 강제 적용 시 앱이 경고 없이 오동작한다(Nuxt 하이드레이션 인라인 스크립트, Tailwind
    # 인라인 스타일, 에디터 iframe, LiveKit WebSocket). 먼저 위반을 수집하고 위반 로그가
    # 더 이상 발생하지 않으면 Content-Security-Policy 로 전환한다. 수집: /api/csp-report
    #
    # img-src 에 https: 를 포함한 이유: 메일 본문은 **origin null 샌드박스 srcdoc
    # iframe** 에서 렌더된다(MailBody). CSP 는 srcdoc iframe 에 상속되므로
    # 'self' 만 두면 null origin 기준이 되어 메일 이미지가 전부 표시되지 않는다.
    # (외부 이미지 차단이 필요하면 CSP 가 아닌 메일 기능에서 처리해야 한다)
    set $csp_report_only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src 'self'; worker-src 'self' blob:; report-uri /api/csp-report";
    add_header Content-Security-Policy-Report-Only $csp_report_only always;

    # ─── 점검 모드(업데이트·복원 중) — docs/update-api.md 7절 ───
    # 설치 관리자가 점검 기간에 마커 파일(nginx/state/maintenance.on)을 생성한다. 마커가 있으면 관리자의 진행 화면이 사용하는
    # 경로(로그인, 관리 › 업데이트, 사전 공지·점검 조회, /api/health)만 허용하고, 그 밖의 API·소켓·구역 프록시는 503 을 반환한다 —
    # 백업 생성 이후의 변경은 롤백 시 소실되기 때문이다. 화면(정적 파일)과 /maintenance/status 는 차단하지 않는다:
    # 화면은 API 의 503 을 확인해 자체적으로 점검 화면으로 전환한다. 마커는 요청마다 확인하므로 nginx reload 가 불필요하며,
    # 설치 관리자 없이 구성한 설치에서는 마커가 생성되지 않아 동작에 영향이 없다.
    set $jw_maintenance "";
    if (-f /etc/nginx/state/maintenance.on) {
        set $jw_maintenance "on";
    }
    if ($uri ~ "^/(api|ws|dav|oauth|sso|git|onlyoffice|livekit|audiorelay|rbi-login)(/|$)") {
        set $jw_maintenance "${jw_maintenance}:guarded";
    }
    if ($uri ~ "^/api/(auth/|admin/system/update/|system/update-notice$|health$)") {
        set $jw_maintenance "${jw_maintenance}:open";
    }
    if ($jw_maintenance = "on:guarded") {
        rewrite ^ /__jw_maintenance last;
    }
    location = /__jw_maintenance {
        internal;
        types { }
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"maintenance","detail":"점검 중입니다"}';
    }

    # 공개 점검 상태 — 설치 관리자의 이 경로 하나만, GET 만 전달한다(점검 여부·시작 시각·예상 시간·연락처만 포함).
    # 설치 관리자의 내부 API 는 이 경로 외에는 노출하지 않는다. 런타임 resolve 이므로 설치 관리자가 없는 설치에서도 nginx 는 기동한다(이 경우 502).
    location = /maintenance/status {
        limit_except GET { deny all; }
        limit_req zone=api burst=20 nodelay;
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 3s;
        set $jw_installer http://jw-installer:8444;
        proxy_pass $jw_installer/internal/update/maintenance;
        proxy_set_header X-JW-Installer-Key "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # 정적 점검 페이지 — nginx 가 직접 보유한 파일이다(업데이트 중에는 frontend 컨테이너도 교체 중일 수 있다).
    location = /maintenance.html {
        root /etc/nginx/static;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # 오프라인 업데이트의 번들·이미지 업로드 — 대용량. 본문을 디스크에 버퍼링하지 않고 스트리밍으로 전달한다.
    # 프런트 리버스 프록시가 있으면 해당 프록시의 본문 상한도 해제해야 한다(해제하지 않는 경우 "서버에 있는 파일 경로" 방식을 사용한다).
    location ~ "^/api/admin/system/update/offline/(bundle$|images/)" {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # ─── ACME challenge (certbot) ───
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── CalDAV/CardDAV 디스커버리 ───
    location = /.well-known/caldav {
        return 301 /dav/;
    }
    location = /.well-known/carddav {
        return 301 /dav/;
    }

    # ─── 메일 앱 자동 설정 → FastAPI (app/mail/client_setup.py) ───
    # Thunderbird·삼성 autoconfig, 아웃룩 POX autodiscover(POST XML, DNS _autodiscover._tcp SRV 가 이 경로로 유도한다)
    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /mail/config-v1.1.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~* ^/autodiscover/autodiscover\.xml$ {
        limit_req zone=api burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── OAuth/OIDC 디스커버리 (RFC 8414 / RFC 9728) → FastAPI. issuer가 루트이므로 루트 경로 필수 ───
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/openid-configuration {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /.well-known/oauth-protected-resource {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── DAV 프록시 → FastAPI (CalDAV/CardDAV) ───
    location /dav/ {
        limit_req zone=dav burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── 파일 업로드 (대용량) ───
    location /api/files/upload {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 앱 상한(general.upload_max_size_mb, 관리자 화면에서 최대 10GB)보다 크게 설정한다.
        # 여기서 먼저 차단되면 백엔드가 413 을 반환할 수 없어 원인 파악이 어렵다.
        client_max_body_size 10G;

        # 중요: 요청 버퍼링 해제.
        # 기본값(on)이면 nginx 가 업로드 전체를 디스크에 기록한 후에야 백엔드로
        # 전송한다 — 10GB 업로드에 디스크 왕복이 두 번 발생한다. 백엔드는 이미 1MB
        # 청크로 스트리밍 기록하므로(files/router.py) 프록시 버퍼링이 이를 무력화하고 있었다.
        proxy_request_buffering off;

        # 저속 회선 대응. 5GB 를 300s 안에 전송하려면 17MB/s(136Mbps)가 지속되어야 하나
        # 가정용 업링크로는 불가능하여, 용량 한도와 무관하게 타임아웃으로 연결이 종료되고 있었다.
        client_body_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # ─── OAuth Provider → FastAPI ───
    # ─── ws-sso (SAML/SCIM). profiles=sso 로 활성화 ───
    # 컨테이너가 없어도 nginx 기동이 실패하지 않도록 런타임 resolve 를 사용한다.
    location /sso/ {
        resolver 127.0.0.11 valid=30s;
        set $sso_upstream http://sso:8000;
        proxy_pass $sso_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── WebSocket 프록시 → FastAPI ───
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 인증 API (강화된 rate limit) ───
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── MCP endpoints (external clients) — Streamable HTTP + legacy SSE ───
    # ^~ so the exact /api/mcp path and /api/mcp/* both land here (and take
    # precedence over the generic /api/ block). Long-lived stream: buffering off.
    location ^~ /api/mcp {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ─── 격리 브라우저(RBI) — 화면·API·스트림은 전용 출처(아래 rbi server 블록)에서만 제공 ───
    # 워크스페이스 출처에는 /rbi/<sid>/ 스트림 경로를 두지 않는다. 세션 컨테이너가 제공하는 콘텐츠(KasmVNC 클라이언트 스크립트·
    # 미러 문서)가 워크스페이스 출처로 제공되면, 컨테이너 침해 시 워크스페이스 쿠키·API 와 동일 출처가 된다. 현재
    # 워크스페이스에는 런처(/rbi, 새 탭으로 rbi 출처를 연다)와 SSO 홉의 워크스페이스 측(/rbi-login)만 남는다. docs/rbi.md §7.
    # /rbi-login: 워크스페이스 로그인 확인 → 일회용 코드 → <RBI_PUBLIC_ORIGIN>/auth/callback (목적지는 백엔드 설정값 고정)
    location = /rbi-login {
        limit_req zone=auth burst=10 nodelay;
        rewrite ^ /api/rbi/site/sso break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── 비공개 확장 경로 ───
    # 리포에 없는 플러그인의 location 은 nginx/private.d/*.conf 에 둔다(git 추적 제외).
    # 파일이 없으면 include 대상이 없다. 접두어 location 은 선언 순서가 아닌
    # 최장 일치로 선택되므로 /api/ 캐치올의 위·아래 어디에 두어도 무방하다.
    include /etc/nginx/private.d/*.conf;

    # ─── API 프록시 → FastAPI ───
    # ─── 내부 서비스 전용 API — 외부 노출 금지 ───
    # ws-ldap 등이 도커 네트워크 내부에서 backend:8000 으로 직접 호출한다.
    # /api/ 캐치올이 이 경로까지 프록시하므로 여기서 명시적으로 차단한다.
    # (backend 자체도 INTERNAL_API_KEY 로 재검사한다 — 이중 방어)
    location /api/internal/ {
        return 404;
    }

    # 메일 — 첨부 업로드(파일당 50MB)와 본문에 포함된 인라인 이미지(data URI)가 있는 발송·임시 저장 요청은
    # 기본 1MB 를 초과한다(2MB 메일이 413). 프런트 리버스 프록시의 client_max_body_size 도 이 값 이상(또는 0)이어야 한다.
    location /api/mail/ {
        limit_req zone=api burst=50 nodelay;
        client_max_body_size 100M;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── Gitea 프록시 ───
    # 주소창에 "/git" 만 입력하면(앱의 이전 경로) 앱의 Git 화면(/code)으로 리다이렉트한다. Gitea 자체는 /git/ 하위에 그대로 유지한다.
    location = /git {
        return 302 /code;
    }
    # 코드 저장소 구역(profiles=gitea)이 없어도 nginx 가 기동하도록 런타임 resolve 를 사용한다(/sso/ 와 동일한 이유).
    # 변수 proxy_pass 는 요청 URI 를 자동으로 변환하지 않는다 — 이전의 `proxy_pass http://gitea:3000/` 과 같이
    # 앞의 /git 을 제거해 전달하도록 rewrite 로 직접 제거한다(쿼리스트링은 그대로 유지된다).
    location /git/ {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $gitea_upstream http://gitea:3000;
        rewrite ^/git/(.*)$ /$1 break;
        proxy_pass $gitea_upstream;
        error_page 502 504 = @zone_missing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 프런트 프록시 경유 시 $scheme 은 내부 구간의 http 이다. Gitea 는 이 값으로 절대 URL(릴리스 다운로드 등)을
        # 생성하므로 $scheme 사용 시 https 페이지에 http 링크가 혼재한다. 프런트 프록시가 전달한 값을 우선한다.
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100M;
    }

    # ─── OnlyOffice Document Server 프록시 (런타임 resolve) ───
    # 주의: proxy_pass 에 변수를 사용하면 nginx 는 지정한 URI 로 "원본 요청 URI 를 통째로 대체" 한다
    #    (접두사만 제거하는 것이 아니다). `proxy_pass $var/` 로 두면 모든 요청이 "/" 로 도달해
    #    OnlyOffice 의 `location = /` 에 일치하여 /welcome/ 으로 302 된다.
    #    → 정규식으로 나머지 경로를 캡처해 직접 결합한다.
    location ~ ^/onlyoffice/(?<oo_path>.*)$ {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $oo_upstream http://onlyoffice:80;
        proxy_pass $oo_upstream/$oo_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        # OnlyOffice 는 X-Forwarded-Prefix 로 서브패스를 인식한다($the_prefix).
        # 누락 시 에디터가 생성하는 절대 URL 에 /onlyoffice 가 빠져 404 가 발생한다.
        proxy_set_header X-Forwarded-Prefix /onlyoffice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 36000s;
        client_max_body_size 100M;
        # 에디터는 같은 출처 iframe 임베드 허용 — XFO(SAMEORIGIN) 충돌 제거 + CSP로 대체
        proxy_hide_header X-Frame-Options;
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
    }

    # ─── WOPI 엔드포인트 (에디터 서버 → 백엔드) ───
    location /api/wopi/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 100M;
    }

    # ─── LiveKit WebSocket 프록시 ───
    # 회의 구역(profiles=livekit)이 없어도 nginx 가 기동하도록 런타임 resolve 사용 — /git/ 과 동일한 방식으로 /livekit 을 제거한다.
    location /livekit/ {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $livekit_upstream http://livekit:7880;
        rewrite ^/livekit/(.*)$ /$1 break;
        proxy_pass $livekit_upstream;
        error_page 502 504 = @zone_missing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── 미설치 구역의 프록시 경로 ───
    # 해당 구역의 컨테이너가 없으면(이름 resolve 실패 또는 연결 실패) 502/504 대신 간단한 404 로 응답한다.
    # 기동 중인 컨테이너가 직접 반환한 오류 응답은 그대로 전달한다(proxy_intercept_errors 는 활성화하지 않는다).
    location @zone_missing {
        types { }                           # 요청 경로의 확장자(.txt 등)로 형식을 결정하지 않도록 함
        default_type application/json;
        return 404 '{"detail":"이 설치에는 없는 기능입니다","code":"zone_not_installed"}';
    }

    # ─── 음성채널 무손실 릴레이(ws-audiorelay) WebSocket·health·info·stats ───
    # profiles=audiorelay 로만 뜨므로 런타임 resolve(컨테이너가 없어도 nginx 는 뜬다 — /sso/ 와 같은 이유).
    # 토큰은 Sec-WebSocket-Protocol / Authorization 으로만 온다(쿼리 금지 — error_log 평문).
    # ★ 이 파일은 bind 마운트라 고친 뒤 `docker compose restart nginx` 가 필요하다(reload 무효).
    location /audiorelay/ {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $audiorelay_upstream http://audiorelay:8090;
        proxy_pass $audiorelay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ─── 프런트 → React 정적 앱(ws-frontend-react) ───
    # 캐시 정책은 컨테이너 측 nginx 가 결정한다(/assets/ 는 immutable, HTML 은 no-cache). 런타임 resolve 이므로 컨테이너가 없어도 nginx 는 기동한다.
    location / {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $frontend_react_upstream http://frontend-react:3000;
        proxy_pass $frontend_react_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 프런트 컨테이너가 없거나 교체 중이면(502·503·504) 동일 주소에서 정적 점검 페이지를 제공한다.
        # /api/ 에는 적용하지 않는다 — 앱은 API 의 실패 상태를 확인해 자체적으로 점검 상태를 조회한다.
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /maintenance.html;
        proxy_connect_timeout 5s;
        include /etc/nginx/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
    }
}

# ─── 격리 브라우저 전용 출처 (RBI_PUBLIC_ORIGIN, 예 https://rbi.example.com) ───
# 워크스페이스와 **다른 출처**다. 워크스페이스 세션 쿠키(host-only)는 이 출처로 전송되지 않고, 이 출처의 세션 쿠키(__Host-jw_rbi)는
# 워크스페이스로 전송되지 않는다. 이 블록이 노출하는 경로는 다음뿐이며 나머지는 404 — 워크스페이스 API·화면은 이 출처로 도달하지 않는다.
#   /  · /assets/*  · /icon.svg  격리 브라우저 단독 앱(frontend-react 의 rbi 빌드, 3001 — 워크스페이스 셸·모듈 없음)
#   /auth/login · /auth/callback  SSO 홉 rbi 측(app/rbi/site.py)
#   /api/rbi/*                    격리 브라우저 사용자 API(rbi 세션 쿠키 — 백엔드 RbiHostGuard 가 동일 목록으로 재차단한다)
#   /rbi/<sid>/…                  세션 스트림(auth_request — rbi 세션 쿠키의 사용자 == 세션 소유자)
# server_name 은 "rbi." 로 시작하는 이름(RBI_PUBLIC_ORIGIN 의 호스트와 일치시킨다 — 다른 이름을 사용하면 이 부분을 수정한다).
# 백엔드는 Host 가 RBI_PUBLIC_ORIGIN 의 호스트일 때만 rbi 출처로 판정한다(그 밖의 "rbi.*" 는 인증·스트림이 모두 거부된다).
# 주의: 이 파일은 bind 마운트이므로 수정 후 `docker compose restart nginx` 가 필요하다(reload 무효).
server {
    include /etc/nginx/site.d/listen-rbi.conf;    # 기본: listen 80; (TLS 를 직접 종단하면 443 ssl)
    server_name ~^rbi\.;
    access_log /var/log/nginx/access.log privacy;
    server_tokens off;

    # ─── 보안 헤더(이 출처 공통) — add_header 를 쓰는 location 은 상속이 끊기므로 스트림 location 은 자기 벌을 둔다 ───
    # CSP: 우리 정적 자산만. 외부(제3자) 출처는 하나도 없다 — 스크립트·스타일·글꼴·이미지·연결 모두 'self'.
    #   frame-src 'self'  : 세션 화면(iframe /rbi/<sid>/…)은 같은 출처
    #   connect-src       : API 와 미러 웹소켓(같은 호스트 ws/wss — 오래된 브라우저는 'self' 에 ws 를 넣지 않는다)
    #   frame-ancestors 'none' : 이 앱을 어디에도 못 끼운다(워크스페이스 안 iframe 포함)
    #   style-src 에 'unsafe-inline' 없음 — 키트는 Tailwind 정적 CSS + CSSOM(element.style)만 쓴다
    set $rbi_csp "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://$host ws://$host; frame-src 'self'; child-src 'self'; worker-src 'none'; manifest-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $rbi_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), clipboard-read=(self), clipboard-write=(self)" always;

    # ─── 단독 앱(정적) → frontend-react 의 rbi 서버(3001). 런타임 resolve — 컨테이너가 없어도 nginx 는 기동한다 ───
    location = / {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $rbi_app_upstream http://frontend-react:3001;
        proxy_pass $rbi_app_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location ^~ /assets/ {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $rbi_app_upstream http://frontend-react:3001;
        proxy_pass $rbi_app_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location = /icon.svg {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $rbi_app_upstream http://frontend-react:3001;
        proxy_pass $rbi_app_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # ─── SSO 홉(rbi 쪽) ───
    location = /auth/login {
        limit_req zone=auth burst=10 nodelay;
        rewrite ^ /api/rbi/site/login break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
    location = /auth/callback {
        limit_req zone=auth burst=10 nodelay;
        rewrite ^ /api/rbi/site/callback break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── 격리 브라우저 사용자 API ───
    # 세션 시작은 컨테이너 기동을 대기한다(최대 ~50초 + 격리 규칙 확인 15초) — 타임아웃을 여유 있게 설정한다.
    location ^~ /api/rbi/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 64k;
    }

    # ─── 세션 스트림 /rbi/<세션32hex>/… → 세션 컨테이너(KasmVNC 또는 mirror-agent) ───
    # 접근 권한: 요청마다 auth_request 가 백엔드(/api/internal/rbi/auth)에 조회한다. 백엔드는 rbi 세션 쿠키의 사용자가
    # 세션 소유자이고 세션 방식과 경로가 일치할 때만 204 와 함께 업스트림 주소·basic auth 를 응답 헤더로 반환하며, nginx 는 해당 값으로
    # proxy_pass 한다. 사용자 브라우저는 VNC 비밀번호를 알 수 없다. 업스트림은 workspace 브리지 게이트웨이(기본 172.28.0.1)에 세션별로
    # 게시된 포트 — 호스트 netfilter 가 해당 포트를 ws-nginx 출발지에만 허용한다(docs/rbi.md).
    # 세션 컨테이너로는 Cookie·Authorization 을 전달하지 않으며, 세션 컨테이너가 보낸 Set-Cookie 는 폐기한다(이 출처의 쿠키 설정 방지).
    location ~ "^/rbi/(?<rbi_sid>[0-9a-f]{32})$" {
        absolute_redirect off;   # RP 뒤이므로 스킴·포트를 알 수 없음 — 상대 경로 사용
        return 302 $uri/;
    }
    # 미러 모드 — view(스크립트 없는 미러 문서, CSP 는 에이전트가 요청마다 nonce 와 함께 부여한 값을 그대로 유지한다) · mirror(웹소켓, 닫힌 어휘) ·
    # asset/<sha256> · font/<파일> · download/<id>. 정규식 location 은 선언 순서대로 선택되므로 아래 범용 /rbi/<sid>/… 보다 먼저 선언한다.
    # 쿼리스트링은 전달하지 않는다. 보안 헤더는 여기서 한 세트만 부여한다(에이전트가 부여한 동일 이름 헤더는 숨긴다).
    location ~ "^/rbi/(?<rbi_sid>[0-9a-f]{32})/(?<rbi_mpath>view|mirror|asset/[0-9a-f]{64}|font/[a-z0-9-]{1,64}\.woff2|download/[0-9a-f]{32})$" {
        auth_request /_rbi_auth;
        auth_request_set $rbi_upstream $upstream_http_x_rbi_upstream;
        auth_request_set $rbi_authz   $upstream_http_x_rbi_authorization;
        error_page 401 = @rbi_denied;
        error_page 403 = @rbi_denied;
        limit_except GET { deny all; }

        proxy_pass http://$rbi_upstream/$rbi_mpath;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 에이전트가 view CSP 의 img-src/font-src 를 "이 호스트 + 이 세션 경로" 로 제한하는 데 사용한다(포트 포함)
        proxy_set_header Host $http_host;
        proxy_set_header X-Rbi-Prefix /rbi/$rbi_sid;
        proxy_set_header Authorization $rbi_authz;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        client_max_body_size 64k;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(), payment=(), usb=(), display-capture=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # 미러 모드 업로드 — 정책(업로드 허용)이 활성화된 대상에서 원격 페이지가 파일 선택 대화상자를 열었을 때만 에이전트가 수신한다.
    # 파일당 50MB(에이전트 상한과 동일). 프런트 리버스 프록시의 client_max_body_size 도 이 값 이상이어야 한다(docs/rbi.md).
    location ~ "^/rbi/(?<rbi_sid>[0-9a-f]{32})/(?<rbi_upath>upload/[0-9a-f]{32})$" {
        auth_request /_rbi_auth;
        auth_request_set $rbi_upstream $upstream_http_x_rbi_upstream;
        auth_request_set $rbi_authz   $upstream_http_x_rbi_authorization;
        error_page 401 = @rbi_denied;
        error_page 403 = @rbi_denied;
        limit_except POST { deny all; }

        proxy_pass http://$rbi_upstream/$rbi_upath;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $rbi_authz;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
        client_max_body_size 50m;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }
    # 픽셀 모드 — KasmVNC(HTTP + WebSocket). 자체 서명 TLS 한 홉이므로 proxy_ssl_verify off.
    # KasmVNC 클라이언트는 단독 앱의 iframe 안에서 열린다 — frame-ancestors 'self'(동일 rbi 출처만). 해당 클라이언트 스크립트는
    # 세션 컨테이너가 제공하므로 이 출처의 앱 CSP 를 적용하지 않는다(KasmVNC 가 인라인 스크립트를 사용한다) — 따라서 이 출처에는 rbi 기능만 둔다.
    location ~ "^/rbi/(?<rbi_sid>[0-9a-f]{32})/(?<rbi_path>.*)$" {
        auth_request /_rbi_auth;
        auth_request_set $rbi_upstream $upstream_http_x_rbi_upstream;
        auth_request_set $rbi_authz   $upstream_http_x_rbi_authorization;
        error_page 401 = @rbi_denied;
        error_page 403 = @rbi_denied;

        proxy_pass https://$rbi_upstream/$rbi_path$is_args$args;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $rbi_authz;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        client_max_body_size 1m;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), payment=(), usb=(), clipboard-read=(self), clipboard-write=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
    }
    location = /_rbi_auth {
        internal;
        proxy_pass http://backend:8000/api/internal/rbi/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }
    location @rbi_denied {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        default_type "text/plain; charset=utf-8";
        return 403 "격리 브라우저 세션에 접근할 수 없습니다 (로그인·소유자 확인)";
    }

    # ─── 그 밖은 전부 404 — 워크스페이스 API(/api/auth·/api/files …)·/oauth·/ws·/dav·/git·내부 API 는 이 출처로 도달하지 않는다 ───
    location / {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $rbi_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404 "Not Found\n";
    }
}
