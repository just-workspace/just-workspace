# just-workspace — Nginx reverse proxy

# 액세스 로그 — 쿼리스트링 제외.
# 기본 combined 포맷의 "$request" 에는 쿼리스트링이 통째로 들어간다. WOPI 규격상
# access_token 이, 비밀번호 재설정 링크에는 token 이 쿼리로 실리기 때문에 그대로 두면
# 평문 토큰이 Docker json 로그로 디스크에 상주한다.
# $request_uri 가 아니라 $uri 를 써야 쿼리가 빠진다.
log_format  privacy  '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── 클라이언트 IP 신뢰 경계 ───
# 신뢰 프록시 = 앞단 리버스 프록시(RP) 하나 — 아래 set_real_ip_from 을 사이트의 RP 주소로 바꾼다(192.168.10.50 은 예시).
# 연결 주소가 그 주소일 때만 X-Real-IP 를 클라이언트 IP 로
# 승격한다(RP 는 X-Real-IP 를 $remote_addr 로 덮어써 보낸다). 그 밖의 접속(LAN 직접,
# 같은 VM 의 러너 등)은 보낸 헤더를 무시하고 연결 주소를 그대로 쓴다.
# 이후 $remote_addr(접속 로그·limit_req 키)는 이미 실제 IP 이고, 뒤로 넘길 때는
# X-Real-IP·X-Forwarded-For 를 이어 붙이지 않고 **덮어쓴다** — 클라이언트가 보낸
# XFF 첫 값이 백엔드까지 살아가 감사 로그를 위조하던 경로(R7 A-3 R2)를 끊는다.
set_real_ip_from  192.168.10.50;
real_ip_header    X-Real-IP;
real_ip_recursive off;

# TLS 는 앞단 리버스 프록시가 종단한다 → 여기서 $scheme 은 항상 http 다.
# 원본 스킴은 RP 가 넘겨준 X-Forwarded-Proto 를 그대로 이어받아야 한다.
# OnlyOffice 는 이 값으로 에디터가 되가져올 절대 URL(cache/files/.../Editor.bin)을
# 만드는데, http 로 나가면 브라우저가 Mixed Content 로 차단해 "Download failed" 가 뜬다.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ─── Rate Limiting ───
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=dav:10m rate=10r/s;

# ─── Gzip 압축 ───
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss image/svg+xml;

# ─── Workspace (HTTP-only, SSL은 외부 nginx 담당) ───
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log privacy;
    server_tokens off;

    # ─── 보안 헤더 ───
    # 공통분은 security-headers.conf 로 뺐다. add_header 를 쓰는 location 은
    # 상속이 끊기므로 거기서도 같은 파일을 include 해야 한다(파일 주석 참고).
    include /etc/nginx/security-headers.conf;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ─── CSP: 아직 Report-Only ───
    # 강제로 켜면 앱이 조용히 깨진다(Nuxt 하이드레이션 인라인 스크립트, Tailwind
    # 인라인 스타일, 에디터 iframe, LiveKit WebSocket). 먼저 위반을 모아 로그가
    # 조용해지면 Content-Security-Policy 로 바꾼다. 수집: /api/csp-report
    #
    # img-src 에 https: 를 넣은 이유: 메일 본문은 **origin null 샌드박스 srcdoc
    # iframe** 에서 렌더된다(MailBody.vue). CSP 는 srcdoc iframe 에 상속되므로
    # 'self' 만 두면 null origin 기준이 되어 메일 이미지가 전부 깨진다.
    # (외부 이미지 차단을 원하면 그건 CSP 가 아니라 메일 기능으로 다뤄야 한다)
    set $csp_report_only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' ws: wss:; frame-src 'self'; worker-src 'self' blob:; report-uri /api/csp-report";
    add_header Content-Security-Policy-Report-Only $csp_report_only always;

    # ─── ACME challenge (certbot) ───
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ─── CalDAV/CardDAV 디스커버리 ───
    location = /.well-known/caldav {
        return 301 /dav/;
    }
    location = /.well-known/carddav {
        return 301 /dav/;
    }

    # ─── 메일 앱 자동 설정 → FastAPI (app/mail/client_setup.py) ───
    # Thunderbird·삼성 autoconfig, 아웃룩 POX autodiscover(POST XML, DNS _autodiscover._tcp SRV 가 이리 보낸다)
    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /mail/config-v1.1.xml {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~* ^/autodiscover/autodiscover\.xml$ {
        limit_req zone=api burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── OAuth/OIDC 디스커버리 (RFC 8414 / RFC 9728) → FastAPI. issuer가 루트라 반드시 루트 경로 ───
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/openid-configuration {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /.well-known/oauth-protected-resource {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── DAV 프록시 → FastAPI (CalDAV/CardDAV) ───
    location /dav/ {
        limit_req zone=dav burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── 파일 업로드 (대용량) ───
    location /api/files/upload {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 앱 상한(general.upload_max_size_mb, 관리자 화면에서 최대 10GB)보다 크게 잡는다.
        # 여기서 먼저 잘리면 백엔드가 413 을 돌려줄 기회조차 없어 원인 파악이 어렵다.
        client_max_body_size 10G;

        # ★ 요청 버퍼링 해제.
        # 기본값(on)이면 nginx 가 업로드 전체를 디스크에 받아 쓴 뒤에야 백엔드로
        # 보낸다 — 10GB 업로드에 디스크 왕복이 두 번 생긴다. 백엔드는 이미 1MB
        # 청크로 스트리밍 기록하므로(files/router.py) 앞단이 그걸 무력화하고 있었다.
        proxy_request_buffering off;

        # 느린 회선 대응. 5GB 를 300s 안에 넣으려면 17MB/s(136Mbps)가 지속돼야 하는데
        # 가정용 업링크로는 불가능해서, 한도와 무관하게 타임아웃으로 끊기고 있었다.
        client_body_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # ─── OAuth Provider → FastAPI ───
    # ─── Grafana 는 여기서 서빙하지 않는다 (내부망 전용) ───
    # 이 서버 블록은 앞단 리버스 프록시를 통해 **공인망에 노출**된다. 관제 화면을
    # 공인 경로에 두면 인증 하나에만 의존하게 된다.
    # 헤더 기반 제한(X-Real-IP 가 사설대역인지)도 검토했지만, 그 값은 상위
    # 프록시가 덮어쓴다는 전제에 의존한다 — 전제가 깨지면 조용히 뚫린다.
    # 그래서 **네트워크 레벨**로 막는다: Grafana 를 VM LAN 포트(3001)에 직접
    # 게시하고 인바운드 NAT 을 뚫지 않는다. 없는 NAT 규칙은 위조할 수 없다.
    #   접속: http://<GRAFANA_BIND>:3001

    # ─── ws-sso (SAML/SCIM). profiles=sso 로 활성화 ───
    # 컨테이너가 없으면 nginx 가 기동 실패하지 않도록 런타임 resolve 를 쓴다.
    location /sso/ {
        resolver 127.0.0.11 valid=30s;
        set $sso_upstream http://sso:8000;
        proxy_pass $sso_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── WebSocket 프록시 → FastAPI ───
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── 인증 API (강화된 rate limit) ───
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── MCP endpoints (external clients) — Streamable HTTP + legacy SSE ───
    # ^~ so the exact /api/mcp path and /api/mcp/* both land here (and take
    # precedence over the generic /api/ block). Long-lived stream: buffering off.
    location ^~ /api/mcp {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ─── 격리 브라우저(RBI) — 화면·API·스트림은 전용 출처(아래 rbi server 블록)에서만 ───
    # 워크스페이스 출처에는 /rbi/<sid>/ 스트림 경로를 두지 않는다. 세션 컨테이너가 내주는 것(KasmVNC 클라이언트 스크립트·
    # 미러 문서)이 워크스페이스 출처에 실리면, 컨테이너가 뚫렸을 때 워크스페이스 쿠키·API 와 같은 출처가 된다. 지금은
    # 워크스페이스에 런처(/rbi, 새 탭으로 rbi 출처를 연다)와 SSO 홉의 워크스페이스 쪽(/rbi-login)만 남는다. docs/rbi.md §7.
    # /rbi-login: 워크스페이스 로그인 확인 → 일회용 코드 → <RBI_PUBLIC_ORIGIN>/auth/callback (목적지는 백엔드 설정값 고정)
    location = /rbi-login {
        limit_req zone=auth burst=10 nodelay;
        rewrite ^ /api/rbi/site/sso break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── 비공개 확장 경로 ───
    # 리포에 없는 플러그인의 location 은 nginx/private.d/*.conf 에 둔다(git 추적 안 함).
    # 파일이 없으면 아무것도 include 되지 않는다. 접두어 location 은 선언 순서가 아니라
    # 가장 긴 일치로 고르므로 /api/ 캐치올보다 위·아래 어디에 있어도 된다.
    include /etc/nginx/private.d/*.conf;

    # ─── API 프록시 → FastAPI ───
    # ─── 내부 서비스 전용 API — 외부 노출 금지 ───
    # ws-ldap 등이 도커 네트워크 안에서 backend:8000 으로 직접 호출한다.
    # /api/ 캐치올이 이 경로까지 프록시하므로 여기서 명시적으로 막는다.
    # (backend 자체도 INTERNAL_API_KEY 로 한 번 더 검사한다 — 이중 방어)
    location /api/internal/ {
        return 404;
    }

    # 메일 — 첨부 올리기(파일당 50MB)와 본문에 박힌 인라인 이미지(data URI)가 든 보내기·임시 저장 요청이
    # 기본 1MB 를 넘는다(2MB 메일이 413). 앞단 리버스 프록시의 client_max_body_size 도 이 이상(또는 0)이어야 한다.
    location /api/mail/ {
        limit_req zone=api burst=50 nodelay;
        client_max_body_size 100M;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── Gitea 프록시 ───
    # 주소창에 "/git" 만 치면(앱 옛 경로) 앱의 Git 화면(/code)으로. Gitea 자체는 /git/ 아래 그대로(검수 P8 K13).
    location = /git {
        return 302 /code;
    }
    location /git/ {
        proxy_pass http://gitea:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100M;
    }

    # ─── OnlyOffice Document Server 프록시 (런타임 resolve) ───
    # ⚠️ proxy_pass 에 변수를 쓰면 nginx 는 지정한 URI 로 "원본 요청 URI 를 통째로 대체" 한다
    #    (접두사만 떼는 게 아니다). `proxy_pass $var/` 로 두면 모든 요청이 "/" 로 도착해
    #    OnlyOffice 의 `location = /` 에 걸려 /welcome/ 으로 302 된다.
    #    → 정규식으로 나머지 경로를 잡아 직접 붙인다.
    location ~ ^/onlyoffice/(?<oo_path>.*)$ {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $oo_upstream http://onlyoffice:80;
        proxy_pass $oo_upstream/$oo_path$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        # OnlyOffice 는 X-Forwarded-Prefix 로 서브패스를 안다($the_prefix).
        # 안 주면 에디터가 만드는 절대 URL 에 /onlyoffice 가 빠져 404 가 난다.
        proxy_set_header X-Forwarded-Prefix /onlyoffice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 36000s;
        client_max_body_size 100M;
        # 에디터는 같은 출처 iframe 임베드 허용 — XFO(SAMEORIGIN) 충돌 제거 + CSP로 대체
        proxy_hide_header X-Frame-Options;
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
    }

    # ─── WOPI 엔드포인트 (에디터 서버 → 백엔드) ───
    location /api/wopi/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        client_max_body_size 100M;
    }

    # ─── LiveKit WebSocket 프록시 ───
    location /livekit/ {
        proxy_pass http://livekit:7880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── 음성채널 무손실 릴레이(ws-audiorelay) WebSocket·health·info·stats ───
    # profiles=audiorelay 로만 뜨므로 런타임 resolve(컨테이너가 없어도 nginx 는 뜬다 — /sso/ 와 같은 이유).
    # 토큰은 Sec-WebSocket-Protocol / Authorization 으로만 온다(쿼리 금지 — error_log 평문).
    # ★ 이 파일은 bind 마운트라 고친 뒤 `docker compose restart nginx` 가 필요하다(reload 무효).
    location /audiorelay/ {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $audiorelay_upstream http://audiorelay:8090;
        proxy_pass $audiorelay_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # ─── 옛 Vue(Nuxt) 청크 ───
    # 옛 Vue 프런트는 없다. 예전 탭·캐시가 찾는 /_nuxt/* 는 React 로 넘기지 않고 바로 404
    # (넘기면 SPA 폴백이 HTML 을 200 으로 돌려줘 스크립트 자리에 HTML 이 들어간다).
    location /_nuxt/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # ─── UI 전환 쿠키(병행 기간 잔재) ───
    # 프런트는 React 하나 — 쿠키와 상관없이 모두 React. 예전 /__ui/* 링크·앱이 심은 jw_ui 쿠키는 지우고 / 로.
    location ~ ^/__ui/(react|vue)$ {
        include /etc/nginx/security-headers.conf;
        absolute_redirect off;
        add_header Set-Cookie "jw_ui=; Path=/; Max-Age=0; SameSite=Lax" always;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    # ─── 프런트 → React 정적 앱(ws-frontend-react) ───
    # 캐시는 컨테이너 쪽 nginx 가 정한다(/assets/ 는 immutable, HTML 은 no-cache). 런타임 resolve 라 컨테이너가 없어도 nginx 는 뜬다.
    location / {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $frontend_react_upstream http://frontend-react:3000;
        proxy_pass $frontend_react_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        include /etc/nginx/security-headers.conf;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy-Report-Only $csp_report_only always;
    }
}

# ─── 격리 브라우저 전용 출처 (RBI_PUBLIC_ORIGIN, 예 https://rbi.example.com) ───
# 워크스페이스와 **다른 출처**다. 워크스페이스 세션 쿠키(host-only)는 여기로 오지 않고, 여기 세션 쿠키(__Host-jw_rbi)는
# 워크스페이스로 가지 않는다. 이 블록이 여는 것은 다음뿐이고 나머지는 404 — 워크스페이스 API·화면은 이 출처로 닿지 않는다.
#   /  · /assets/*  · /icon.svg  격리 브라우저 단독 앱(frontend-react 의 rbi 빌드, 3001 — 워크스페이스 셸·모듈 없음)
#   /auth/login · /auth/callback  SSO 홉 rbi 쪽(app/rbi/site.py)
#   /api/rbi/*                    격리 브라우저 사용자 API(rbi 세션 쿠키 — 백엔드 RbiHostGuard 가 한 번 더 같은 목록으로 막는다)
#   /rbi/<sid>/…                  세션 스트림(auth_request — rbi 세션 쿠키의 사용자 == 세션 소유자)
# server_name 은 "rbi." 로 시작하는 이름(RBI_PUBLIC_ORIGIN 의 호스트와 맞춘다 — 다른 이름을 쓰면 여기를 고친다).
# 백엔드는 Host 가 RBI_PUBLIC_ORIGIN 의 호스트일 때만 rbi 출처로 본다(그 밖의 "rbi.*" 는 인증·스트림이 모두 거부된다).
# ★ 이 파일은 bind 마운트라 고친 뒤 `docker compose restart nginx` 가 필요하다(reload 무효).
server {
    listen 80;
    server_name ~^rbi\.;
    access_log /var/log/nginx/access.log privacy;
    server_tokens off;

    # ─── 보안 헤더(이 출처 공통) — add_header 를 쓰는 location 은 상속이 끊기므로 스트림 location 은 자기 벌을 둔다 ───
    # CSP: 우리 정적 자산만. 외부(제3자) 출처는 하나도 없다 — 스크립트·스타일·글꼴·이미지·연결 모두 'self'.
    #   frame-src 'self'  : 세션 화면(iframe /rbi/<sid>/…)은 같은 출처
    #   connect-src       : API 와 미러 웹소켓(같은 호스트 ws/wss — 오래된 브라우저는 'self' 에 ws 를 넣지 않는다)
    #   frame-ancestors 'none' : 이 앱을 어디에도 못 끼운다(워크스페이스 안 iframe 포함)
    #   style-src 에 'unsafe-inline' 없음 — 키트는 Tailwind 정적 CSS + CSSOM(element.style)만 쓴다
    set $rbi_csp "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://$host ws://$host; frame-src 'self'; child-src 'self'; worker-src 'none'; manifest-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $rbi_csp always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), clipboard-read=(self), clipboard-write=(self)" always;

    # ─── 단독 앱(정적) → frontend-react 의 rbi 서버(3001). 런타임 resolve — 컨테이너가 없어도 nginx 는 뜬다 ───
    location = / {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $rbi_app_upstream http://frontend-react:3001;
        proxy_pass $rbi_app_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location ^~ /assets/ {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $rbi_app_upstream http://frontend-react:3001;
        proxy_pass $rbi_app_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
    location = /icon.svg {
        resolver 127.0.0.11 valid=30s;
        resolver_timeout 5s;
        set $rbi_app_upstream http://frontend-react:3001;
        proxy_pass $rbi_app_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # ─── SSO 홉(rbi 쪽) ───
    location = /auth/login {
        limit_req zone=auth burst=10 nodelay;
        rewrite ^ /api/rbi/site/login break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
    location = /auth/callback {
        limit_req zone=auth burst=10 nodelay;
        rewrite ^ /api/rbi/site/callback break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ─── 격리 브라우저 사용자 API ───
    # 세션 시작은 컨테이너 기동을 기다린다(최대 ~50초 + 격리 규칙 확인 15초) — 넉넉히.
    location ^~ /api/rbi/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        client_max_body_size 64k;
    }

    # ─── 세션 스트림 /rbi/<세션32hex>/… → 세션 컨테이너(KasmVNC 또는 mirror-agent) ───
    # 누가 열 수 있나: 매 요청 auth_request 가 백엔드(/api/internal/rbi/auth)에 묻는다. 백엔드는 rbi 세션 쿠키의 사용자가
    # 세션 소유자이고 세션 방식과 경로가 맞을 때만 204 와 함께 업스트림 주소·basic auth 를 응답 헤더로 돌려주고, nginx 는 그 값으로
    # proxy_pass 한다. 사용자 브라우저는 VNC 비밀번호를 모른다. 업스트림은 workspace 브리지 게이트웨이(기본 172.28.0.1)에 세션별로
    # 게시된 포트 — 호스트 netfilter 가 그 포트를 ws-nginx 출발지에만 열어 준다(docs/rbi.md).
    # 세션 컨테이너로는 Cookie·Authorization 을 넘기지 않고, 세션 컨테이너가 보낸 Set-Cookie 는 버린다(이 출처의 쿠키를 못 심게).
    location ~ "^/rbi/(?<rbi_sid>[0-9a-f]{32})$" {
        absolute_redirect off;   # RP 뒤라 스킴·포트를 모른다 — 상대 경로로
        return 302 $uri/;
    }
    # 미러 모드 — view(스크립트 없는 미러 문서, CSP 는 에이전트가 요청마다 nonce 와 함께 붙인 것을 그대로 둔다) · mirror(웹소켓, 닫힌 어휘) ·
    # asset/<sha256> · font/<파일> · download/<id>. 정규식 location 은 선언 순서대로 고르므로 아래 범용 /rbi/<sid>/… 보다 먼저.
    # 쿼리스트링은 넘기지 않는다. 보안 헤더는 여기서 한 벌만(에이전트가 붙인 같은 이름 헤더는 가린다).
    location ~ "^/rbi/(?<rbi_sid>[0-9a-f]{32})/(?<rbi_mpath>view|mirror|asset/[0-9a-f]{64}|font/[a-z0-9-]{1,64}\.woff2|download/[0-9a-f]{32})$" {
        auth_request /_rbi_auth;
        auth_request_set $rbi_upstream $upstream_http_x_rbi_upstream;
        auth_request_set $rbi_authz   $upstream_http_x_rbi_authorization;
        error_page 401 = @rbi_denied;
        error_page 403 = @rbi_denied;
        limit_except GET { deny all; }

        proxy_pass http://$rbi_upstream/$rbi_mpath;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 에이전트가 view CSP 의 img-src/font-src 를 "이 호스트 + 이 세션 경로" 로 좁히는 데 쓴다(포트 포함)
        proxy_set_header Host $http_host;
        proxy_set_header X-Rbi-Prefix /rbi/$rbi_sid;
        proxy_set_header Authorization $rbi_authz;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        client_max_body_size 64k;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(), payment=(), usb=(), display-capture=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # 미러 모드 올리기 — 정책(업로드 허용)이 켜진 대상에서 원격 페이지가 파일 선택 대화상자를 열었을 때만 에이전트가 받는다.
    # 한 파일 50MB(에이전트 상한과 같다). 앞단 리버스 프록시의 client_max_body_size 도 이 이상이어야 한다(docs/rbi.md).
    location ~ "^/rbi/(?<rbi_sid>[0-9a-f]{32})/(?<rbi_upath>upload/[0-9a-f]{32})$" {
        auth_request /_rbi_auth;
        auth_request_set $rbi_upstream $upstream_http_x_rbi_upstream;
        auth_request_set $rbi_authz   $upstream_http_x_rbi_authorization;
        error_page 401 = @rbi_denied;
        error_page 403 = @rbi_denied;
        limit_except POST { deny all; }

        proxy_pass http://$rbi_upstream/$rbi_upath;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $rbi_authz;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
        client_max_body_size 50m;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
    }
    # 픽셀 모드 — KasmVNC(HTTP + WebSocket). 자가서명 TLS 한 홉이라 proxy_ssl_verify off.
    # KasmVNC 클라이언트는 단독 앱의 iframe 안에서 열린다 — frame-ancestors 'self'(같은 rbi 출처만). 그 클라이언트 스크립트는
    # 세션 컨테이너가 내주므로 이 출처의 앱 CSP 를 씌우지 않는다(KasmVNC 가 인라인 스크립트를 쓴다) — 그래서 이 출처에는 rbi 기능만 둔다.
    location ~ "^/rbi/(?<rbi_sid>[0-9a-f]{32})/(?<rbi_path>.*)$" {
        auth_request /_rbi_auth;
        auth_request_set $rbi_upstream $upstream_http_x_rbi_upstream;
        auth_request_set $rbi_authz   $upstream_http_x_rbi_authorization;
        error_page 401 = @rbi_denied;
        error_page 403 = @rbi_denied;

        proxy_pass https://$rbi_upstream/$rbi_path$is_args$args;
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header Authorization $rbi_authz;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        client_max_body_size 1m;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), payment=(), usb=(), clipboard-read=(self), clipboard-write=(self)" always;
        add_header Content-Security-Policy "frame-ancestors 'self';" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
    }
    location = /_rbi_auth {
        internal;
        proxy_pass http://backend:8000/api/internal/rbi/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }
    location @rbi_denied {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control "no-store" always;
        default_type "text/plain; charset=utf-8";
        return 403 "격리 브라우저 세션에 접근할 수 없습니다 (로그인·소유자 확인)";
    }

    # ─── 그 밖은 전부 404 — 워크스페이스 API(/api/auth·/api/files …)·/oauth·/ws·/dav·/git·내부 API 가 이 출처로 닿지 않는다 ───
    location / {
        default_type "text/plain; charset=utf-8";
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $rbi_csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        return 404 "Not Found\n";
    }
}
