# 공통 보안 응답 헤더 (X-Frame-Options 제외 — location 마다 정책이 상이하다).
#
# 중요: 이 파일의 존재 이유:
#   nginx 의 add_header 는 "현재 레벨에 add_header 가 하나라도 있으면 상위 레벨을
#   상속하지 않는다". 따라서 server 블록에 보안 헤더를 선언해도, 캐시 헤더
#   하나를 위해 add_header 를 사용한 location(/ , 에디터 프록시들)에서는
#   보안 헤더가 전부 누락된다. 설정 파일에는 존재하나 응답에는 없는 상태가 되며,
#   이 상태는 발견하기가 가장 어렵다.
#
#   따라서 add_header 를 사용하는 location 은 반드시 이 파일을 include 한다.
#
# 마운트 위치는 /etc/nginx/ 이다 — conf.d/ 에 두면 nginx 가 conf.d/*.conf 를
# 자동 include 하여 http 레벨에 중복 적용된다.

add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 회의(카메라·마이크·화면 공유)는 동일 출처에서만 허용. camera=() 이면 IP 직접 접속(RP 를 경유하지 않는 경로)에서
# 카메라가 정책으로 차단된다(RP 가 자체 헤더를 하나 더 추가해 우연히 허용되던 상태였다). 다른 출처 iframe 에는 계속 허용하지 않는다.
# 주의: http(비보안 컨텍스트)에서는 이 헤더와 무관하게 브라우저가 getUserMedia 를 차단한다 — https 필요.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

# 사이트별 추가 헤더(이 nginx 가 TLS 를 직접 종단할 때의 HSTS 등). 기본 파일은 비어 있다.
include /etc/nginx/site.d/headers.conf;
