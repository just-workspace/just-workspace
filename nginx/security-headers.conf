# 공통 보안 응답 헤더 (X-Frame-Options 제외 — location 마다 정책이 다르다).
#
# ★ 이 파일이 존재하는 이유:
#   nginx 의 add_header 는 "현재 레벨에 add_header 가 하나라도 있으면 상위 레벨을
#   상속하지 않는다". 그래서 server 블록에 보안 헤더를 선언해 놓아도, 캐시 헤더
#   하나 때문에 add_header 를 쓴 location(/ , /_nuxt/ , 에디터 프록시들)에서는
#   보안 헤더가 통째로 사라진다. 설정 파일에는 있는데 응답에는 없는 상태가 되고,
#   그게 제일 발견하기 어렵다(2026-08-31 전수조사에서 실제로 5개 location 적발).
#
#   그래서 add_header 를 쓰는 location 은 반드시 이 파일을 include 한다.
#
# 마운트 위치는 /etc/nginx/ 다 — conf.d/ 에 두면 nginx 가 conf.d/*.conf 를
# 자동 include 해서 http 레벨에 중복 적용된다.

add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 회의(카메라·마이크·화면 공유)는 같은 출처에서만 허용. camera=() 이면 IP 직접 접속(RP 를 안 거치는 경로)에서
# 카메라가 정책으로 막힌다(RP 는 자기 헤더를 하나 더 붙여 우연히 풀렸던 것). 다른 출처 iframe 에는 여전히 안 준다.
# 주의: http(비보안 컨텍스트)에서는 이 헤더와 무관하게 브라우저가 getUserMedia 를 막는다 — https 가 필요.
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
