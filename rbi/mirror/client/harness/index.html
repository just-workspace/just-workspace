<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RBI 미러 — 개발 하네스</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;font:13px system-ui,sans-serif;background:#1b1d22;color:#ddd}
  #bar{display:flex;gap:10px;align-items:center;padding:6px 10px;background:#272a31;border-bottom:1px solid #3a3d45;height:28px}
  #bar .url{font-family:ui-monospace,monospace;color:#9fd2ff;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #bar .st{color:#aaa;font-family:ui-monospace,monospace;font-size:12px;white-space:nowrap}
  #bar button{background:#3a3d45;color:#ddd;border:0;border-radius:4px;padding:3px 8px;cursor:pointer}
  #wrap{position:absolute;top:41px;left:0;right:0;bottom:0;background:#000}
  iframe{width:100%;height:100%;border:0;background:#fff;display:block}
</style>
</head>
<body>
<div id="bar">
  <span id="dot" style="width:8px;height:8px;border-radius:50%;background:#d44;display:inline-block"></span>
  <span class="url" id="url">—</span>
  <span class="st" id="st">connecting…</span>
  <button id="resync">resync</button>
</div>
<div id="wrap">
  <iframe id="mirror" title="mirror" sandbox="allow-same-origin" referrerpolicy="no-referrer"></iframe>
</div>
<div id="imehost"></div>
<script type="module" src="./harness.js"></script>
</body>
</html>
