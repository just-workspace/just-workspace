<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>long — 스크롤 동기화</title>
<style>
 body{margin:0;font:14px "Noto Sans KR",Arial,sans-serif;background:#fff;color:#222}
 h1{margin:0;padding:12px 16px;background:#2b3a55;color:#fff;font-size:18px}
 table{border-collapse:collapse;margin:12px 16px;width:calc(100% - 252px)}
 td,th{border-bottom:1px solid #e3e6ea;padding:6px 10px;text-align:left}
 tr:nth-child(2n) td{background:#f7f9fb}
 #box{position:fixed;right:16px;top:60px;width:200px;height:300px;overflow:auto;border:1px solid #ccd;background:#fff}
 #box div{padding:6px 8px;border-bottom:1px solid #eee}
</style></head><body>
<h1>랩 목록 (스크롤 시험 — 400행)</h1>
<table><thead><tr><th>#</th><th>이름</th><th>경로</th><th>노드</th><th>수정</th></tr></thead><tbody id="tb"></tbody></table>
<div id="box"></div>
<script>
const tb = document.getElementById('tb'), box = document.getElementById('box')
for (let i = 1; i <= 400; i++) { const tr = document.createElement('tr'); tr.innerHTML = `<td>${i}</td><td>lab-${String(i).padStart(3,'0')} CCNA 실습</td><td>/labs/folder${i % 7}/lab-${i}.unl</td><td>${(i * 7) % 23 + 2}</td><td>2026-10-${String(i % 28 + 1).padStart(2,'0')}</td>`; tb.appendChild(tr) }
for (let i = 1; i <= 80; i++) { const d = document.createElement('div'); d.textContent = '폴더 항목 ' + i; box.appendChild(d) }
</script></body></html>
